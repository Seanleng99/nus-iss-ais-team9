AWSTemplateFormatVersion: "2010-09-09"
Description: Minimum shared AWS infrastructure for the synthetic financial wellness coach demo.

Parameters:
  ProjectName:
    Type: String
    Default: ai-financial-wellness-coach
  AiRepositoryName:
    Type: String
    Default: nus-iss-ais-team9-ai
  BackendRepositoryName:
    Type: String
    Default: nus-iss-ais-team9-backend
  FrontendRepositoryName:
    Type: String
    Default: nus-iss-ais-team9-frontend
  OpenAiApiKeySecretArn:
    Type: String
    Description: ARN of the existing Secrets Manager JSON secret containing the OpenAI API key under value.
  DatabaseInstanceClass:
    Type: String
    Default: db.t4g.micro
    AllowedValues:
      - db.t4g.micro
      - db.t3.micro
  DatabaseInstanceIdentifier:
    Type: String
    Default: ai-financial-wellness-coach-demo
    Description: Change this together with DatabaseSnapshotIdentifier for a final snapshot restore.
  DatabaseName:
    Type: String
    Default: financial_wellness
    AllowedPattern: "^[a-zA-Z][a-zA-Z0-9_]{0,62}$"
  DatabaseMasterUsername:
    Type: String
    Default: coachadmin
    AllowedPattern: "^[a-zA-Z][a-zA-Z0-9_]{0,62}$"
  DatabaseSnapshotIdentifier:
    Type: String
    Default: ""
    Description: Optional destination-account RDS snapshot for a data-preserving restore.
  RestoredDatabaseSecretArn:
    Type: String
    Default: ""
    Description: RDS-managed master secret ARN after a snapshot restore and password rotation.
  CloudFrontOriginPrefixListId:
    Type: String
    Default: ""
    AllowedPattern: "^$|^pl-[0-9a-f]+$"
    Description: Regional ID of com.amazonaws.global.cloudfront.origin-facing.
  CustomDomainName:
    Type: String
    Default: ""
    AllowedPattern: "^$|^[a-z0-9][a-z0-9.-]*[a-z0-9]$"
    Description: Optional browser-facing DNS name for the CloudFront distribution.
  CustomDomainHostedZoneId:
    Type: String
    Default: ""
    AllowedPattern: "^$|^Z[A-Z0-9]+$"
    Description: Public Route 53 hosted zone containing both custom DNS names.
  CloudFrontViewerCertificateArn:
    Type: String
    Default: ""
    AllowedPattern: "^$|^arn:aws:acm:us-east-1:[0-9]{12}:certificate/[0-9a-f-]+$"
    Description: Optional us-east-1 ACM certificate covering CustomDomainName.
  OriginDomainName:
    Type: String
    Default: ""
    AllowedPattern: "^$|^[a-z0-9][a-z0-9.-]*[a-z0-9]$"
    Description: Optional public DNS name whose regional ACM certificate fronts the ALB.

Rules:
  CompleteCustomDomainConfiguration:
    Assertions:
      - Assert:
          Fn::Or:
            - Fn::And:
                - Fn::Equals: [!Ref CustomDomainName, ""]
                - Fn::Equals: [!Ref CustomDomainHostedZoneId, ""]
                - Fn::Equals: [!Ref CloudFrontViewerCertificateArn, ""]
                - Fn::Equals: [!Ref OriginDomainName, ""]
            - Fn::And:
                - Fn::Not: [!Equals [!Ref CustomDomainName, ""]]
                - Fn::Not: [!Equals [!Ref CustomDomainHostedZoneId, ""]]
                - Fn::Not: [!Equals [!Ref CloudFrontViewerCertificateArn, ""]]
                - Fn::Not: [!Equals [!Ref OriginDomainName, ""]]
        AssertDescription: Custom domain, hosted zone, viewer certificate, and origin domain must be supplied together.

Conditions:
  HasCloudFrontOriginPrefixList: !Not [!Equals [!Ref CloudFrontOriginPrefixListId, ""]]
  HasCustomDomain: !Not [!Equals [!Ref CustomDomainName, ""]]
  RestoreDatabaseSnapshot: !Not [!Equals [!Ref DatabaseSnapshotIdentifier, ""]]
  FreshDatabase: !Equals [!Ref DatabaseSnapshotIdentifier, ""]
  HasRestoredDatabaseSecret: !Not [!Equals [!Ref RestoredDatabaseSecretArn, ""]]

Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.42.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-vpc
        - Key: Project
          Value: !Ref ProjectName

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-igw

  InternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      InternetGatewayId: !Ref InternetGateway
      VpcId: !Ref Vpc

  PublicSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      AvailabilityZone: !Select [0, !GetAZs ""]
      CidrBlock: 10.42.0.0/24
      MapPublicIpOnLaunch: true
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-public-a

  PublicSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      AvailabilityZone: !Select [1, !GetAZs ""]
      CidrBlock: 10.42.1.0/24
      MapPublicIpOnLaunch: true
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-public-b

  DatabaseSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      AvailabilityZone: !Select [0, !GetAZs ""]
      CidrBlock: 10.42.10.0/24
      MapPublicIpOnLaunch: false
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-database-a
        - Key: Project
          Value: !Ref ProjectName

  DatabaseSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      AvailabilityZone: !Select [1, !GetAZs ""]
      CidrBlock: 10.42.11.0/24
      MapPublicIpOnLaunch: false
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-database-b
        - Key: Project
          Value: !Ref ProjectName

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-public

  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: InternetGatewayAttachment
    Properties:
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway
      RouteTableId: !Ref PublicRouteTable

  PublicSubnetARouteAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PublicRouteTable
      SubnetId: !Ref PublicSubnetA

  PublicSubnetBRouteAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PublicRouteTable
      SubnetId: !Ref PublicSubnetB

  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: CloudFront-only entry point for the application origin
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-alb

  AlbHttpIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      CidrIp: !If [HasCloudFrontOriginPrefixList, !Ref AWS::NoValue, 0.0.0.0/0]
      Description: !If
        - HasCloudFrontOriginPrefixList
        - CloudFront origin-facing staged HTTP and HTTPS listener range
        - Temporary public HTTP fallback until the managed prefix list is supplied
      FromPort: 80
      GroupId: !Ref AlbSecurityGroup
      IpProtocol: tcp
      SourcePrefixListId: !If
        - HasCloudFrontOriginPrefixList
        - !Ref CloudFrontOriginPrefixListId
        - !Ref AWS::NoValue
      ToPort: !If [HasCloudFrontOriginPrefixList, 443, 80]

  FrontendSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Streamlit ingress only from the ALB
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8501
          ToPort: 8501
          SourceSecurityGroupId: !Ref AlbSecurityGroup
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-frontend

  BackendSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Backend ingress from the ALB and Streamlit
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          SourceSecurityGroupId: !Ref AlbSecurityGroup
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          SourceSecurityGroupId: !Ref FrontendSecurityGroup
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-backend

  AiSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: AI service ingress only from the backend
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8001
          ToPort: 8001
          SourceSecurityGroupId: !Ref BackendSecurityGroup
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-ai

  DatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: PostgreSQL ingress only from the application backend
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref BackendSecurityGroup
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-database
        - Key: Project
          Value: !Ref ProjectName

  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      IpAddressType: ipv4
      Scheme: internet-facing
      SecurityGroups:
        - !Ref AlbSecurityGroup
      Subnets:
        - !Ref PublicSubnetA
        - !Ref PublicSubnetB
      Type: application
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  CloudFrontOriginSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: Verification value shared only by CloudFront and ALB listener rules
      GenerateSecretString:
        ExcludePunctuation: true
        GenerateStringKey: value
        PasswordLength: 64
        SecretStringTemplate: "{}"
      Name: !Sub ${ProjectName}/demo/cloudfront-origin-verification
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: demo

  FrontendDistribution:
    Type: AWS::CloudFront::Distribution
    Metadata:
      cfn-lint:
        config:
          ignore_checks:
            - W1030
    Properties:
      DistributionConfig:
        Comment: !Sub HTTPS entry point for ${ProjectName}
        DefaultCacheBehavior:
          AllowedMethods:
            - DELETE
            - GET
            - HEAD
            - OPTIONS
            - PATCH
            - POST
            - PUT
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
          CachedMethods:
            - GET
            - HEAD
            - OPTIONS
          Compress: false
          OriginRequestPolicyId: 216adef6-5c7f-47e4-b989-5492eafa07d3
          TargetOriginId: application-alb
          ViewerProtocolPolicy: redirect-to-https
        Enabled: true
        HttpVersion: http2and3
        IPV6Enabled: true
        Origins:
          - CustomOriginConfig:
              HTTPPort: 80
              HTTPSPort: 443
              OriginProtocolPolicy: !If [HasCustomDomain, https-only, http-only]
              OriginReadTimeout: 60
              OriginSSLProtocols: !If
                - HasCustomDomain
                - [TLSv1.2]
                - !Ref AWS::NoValue
            DomainName: !If
              - HasCustomDomain
              - !Ref OriginDomainName
              - !GetAtt LoadBalancer.DNSName
            Id: application-alb
            OriginCustomHeaders:
              - HeaderName: X-Coach-Origin-Verify
                HeaderValue: !Sub "{{resolve:secretsmanager:${CloudFrontOriginSecret}:SecretString:value}}"
        PriceClass: PriceClass_200
        Aliases: !If
          - HasCustomDomain
          - [!Ref CustomDomainName]
          - !Ref AWS::NoValue
        ViewerCertificate: !If
          - HasCustomDomain
          - AcmCertificateArn: !Ref CloudFrontViewerCertificateArn
            MinimumProtocolVersion: TLSv1.2_2021
            SslSupportMethod: sni-only
          - CloudFrontDefaultCertificate: true
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: demo

  CustomDomainRecord:
    Type: AWS::Route53::RecordSet
    Condition: HasCustomDomain
    Properties:
      AliasTarget:
        DNSName: !GetAtt FrontendDistribution.DomainName
        EvaluateTargetHealth: false
        HostedZoneId: Z2FDTNDATAQYW2
      HostedZoneId: !Ref CustomDomainHostedZoneId
      Name: !Ref CustomDomainName
      Type: A

  OriginDomainRecord:
    Type: AWS::Route53::RecordSet
    Condition: HasCustomDomain
    Properties:
      AliasTarget:
        DNSName: !GetAtt LoadBalancer.DNSName
        EvaluateTargetHealth: true
        HostedZoneId: !GetAtt LoadBalancer.CanonicalHostedZoneID
      HostedZoneId: !Ref CustomDomainHostedZoneId
      Name: !Ref OriginDomainName
      Type: A

  UserPool:
    Type: AWS::Cognito::UserPool
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      AutoVerifiedAttributes:
        - email
      DeletionProtection: ACTIVE
      MfaConfiguration: OPTIONAL
      EnabledMfas:
        - SOFTWARE_TOKEN_MFA
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
          RequireUppercase: true
          TemporaryPasswordValidityDays: 3
      Schema:
        - Name: legacy_sub
          AttributeDataType: String
          Mutable: false
          StringAttributeConstraints:
            MinLength: "1"
            MaxLength: "255"
      UserPoolName: !Sub ${ProjectName}-demo-users
      UsernameAttributes:
        - email
      UserPoolTags:
        Project: !Ref ProjectName
        Environment: demo

  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Sub ${ProjectName}-${AWS::AccountId}
      UserPoolId: !Ref UserPool

  FrontendUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      AllowedOAuthFlows:
        - code
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthScopes:
        - email
        - openid
        - profile
      CallbackURLs:
        - !If
          - HasCustomDomain
          - !Sub https://${CustomDomainName}/oauth2callback
          - !Sub https://${FrontendDistribution.DomainName}/oauth2callback
        - !If
          - HasCustomDomain
          - !Sub https://${FrontendDistribution.DomainName}/oauth2callback
          - !Ref AWS::NoValue
      ClientName: !Sub ${ProjectName}-streamlit
      DefaultRedirectURI: !If
        - HasCustomDomain
        - !Sub https://${CustomDomainName}/oauth2callback
        - !Sub https://${FrontendDistribution.DomainName}/oauth2callback
      EnableTokenRevocation: true
      ExplicitAuthFlows:
        - ALLOW_REFRESH_TOKEN_AUTH
        - ALLOW_USER_SRP_AUTH
      GenerateSecret: false
      IdTokenValidity: 1
      LogoutURLs:
        - !If
          - HasCustomDomain
          - !Sub https://${CustomDomainName}/
          - !Sub https://${FrontendDistribution.DomainName}/
        - !If
          - HasCustomDomain
          - !Sub https://${FrontendDistribution.DomainName}/
          - !Ref AWS::NoValue
      PreventUserExistenceErrors: ENABLED
      ReadAttributes:
        - email
        - email_verified
        - custom:legacy_sub
      RefreshTokenValidity: 1
      SupportedIdentityProviders:
        - COGNITO
      TokenValidityUnits:
        IdToken: hours
        RefreshToken: days
      UserPoolId: !Ref UserPool

  EcsCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub ${ProjectName}-demo
      ClusterSettings:
        - Name: containerInsights
          Value: enabled
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  ServiceDiscoveryNamespace:
    Type: AWS::ServiceDiscovery::PrivateDnsNamespace
    Properties:
      Description: Private service discovery for the financial wellness coach
      Name: coach.internal
      Vpc: !Ref Vpc

  AiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /ecs/${ProjectName}/ai
      RetentionInDays: 30

  BackendLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /ecs/${ProjectName}/backend
      RetentionInDays: 30

  FrontendLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /ecs/${ProjectName}/frontend
      RetentionInDays: 30

  BackendApiKeySecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: Synthetic demo automation-to-backend API key
      GenerateSecretString:
        ExcludePunctuation: true
        GenerateStringKey: value
        PasswordLength: 40
        SecretStringTemplate: '{"purpose":"backend-automation-api-key"}'
      Name: !Sub ${ProjectName}/demo/backend-api-key

  FrontendOidcCookieSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: Streamlit OIDC identity-cookie signing secret
      GenerateSecretString:
        ExcludePunctuation: true
        GenerateStringKey: value
        PasswordLength: 64
        SecretStringTemplate: '{"purpose":"frontend-oidc-cookie"}'
      Name: !Sub ${ProjectName}/demo/frontend-oidc-cookie

  AiServiceApiKeySecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: Synthetic demo backend-to-AI API key
      GenerateSecretString:
        ExcludePunctuation: true
        GenerateStringKey: value
        PasswordLength: 40
        SecretStringTemplate: '{"purpose":"ai-service-api-key"}'
      Name: !Sub ${ProjectName}/demo/ai-service-api-key

  DatabaseSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Private database subnets for the synthetic demo
      SubnetIds:
        - !Ref DatabaseSubnetA
        - !Ref DatabaseSubnetB
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  Database:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      AllocatedStorage: "20"
      AutoMinorVersionUpgrade: true
      BackupRetentionPeriod: 1
      CopyTagsToSnapshot: true
      DBInstanceClass: !Ref DatabaseInstanceClass
      DBInstanceIdentifier: !Ref DatabaseInstanceIdentifier
      DBName: !If [RestoreDatabaseSnapshot, !Ref AWS::NoValue, !Ref DatabaseName]
      DBSnapshotIdentifier: !If [RestoreDatabaseSnapshot, !Ref DatabaseSnapshotIdentifier, !Ref AWS::NoValue]
      DBSubnetGroupName: !Ref DatabaseSubnetGroup
      EnableIAMDatabaseAuthentication: false
      Engine: postgres
      ManageMasterUserPassword: !If [RestoreDatabaseSnapshot, !Ref AWS::NoValue, true]
      MasterUsername: !If [RestoreDatabaseSnapshot, !Ref AWS::NoValue, !Ref DatabaseMasterUsername]
      MaxAllocatedStorage: 100
      MultiAZ: false
      PubliclyAccessible: false
      StorageEncrypted: !If [RestoreDatabaseSnapshot, !Ref AWS::NoValue, true]
      StorageType: gp3
      VPCSecurityGroups:
        - !GetAtt DatabaseSecurityGroup.GroupId
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: demo

  TaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${ProjectName}-ecs-execution
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: ReadDemoServiceSecrets
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource:
                  - !Ref BackendApiKeySecret
                  - !Ref AiServiceApiKeySecret
                  - !Ref OpenAiApiKeySecretArn
                  - !Ref FrontendOidcCookieSecret
                  - !If
                    - RestoreDatabaseSnapshot
                    - !If [HasRestoredDatabaseSecret, !Ref RestoredDatabaseSecretArn, !Ref AWS::NoValue]
                    - !GetAtt Database.MasterUserSecret.SecretArn

  AppTaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${ProjectName}-app-task
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole

  BackendTaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${ProjectName}-backend-task
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ReadCurrentDatabaseCredentials
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !GetAtt Database.MasterUserSecret.SecretArn

  AiTaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${ProjectName}-ai-task
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole

  AiRepository:
    Type: AWS::ECR::Repository
    Properties:
      EmptyOnDelete: true
      EncryptionConfiguration:
        EncryptionType: AES256
      ImageScanningConfiguration:
        ScanOnPush: true
      ImageTagMutability: IMMUTABLE
      LifecyclePolicy:
        LifecyclePolicyText: >-
          {"rules":[{"rulePriority":1,"description":"Expire untagged images after one day","selection":{"tagStatus":"untagged","countType":"sinceImagePushed","countUnit":"days","countNumber":1},"action":{"type":"expire"}},{"rulePriority":2,"description":"Retain ten newest images","selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":10},"action":{"type":"expire"}}]}
      RepositoryName: !Ref AiRepositoryName

  BackendRepository:
    Type: AWS::ECR::Repository
    Properties:
      EmptyOnDelete: true
      EncryptionConfiguration:
        EncryptionType: AES256
      ImageScanningConfiguration:
        ScanOnPush: true
      ImageTagMutability: IMMUTABLE
      LifecyclePolicy:
        LifecyclePolicyText: >-
          {"rules":[{"rulePriority":1,"description":"Expire untagged images after one day","selection":{"tagStatus":"untagged","countType":"sinceImagePushed","countUnit":"days","countNumber":1},"action":{"type":"expire"}},{"rulePriority":2,"description":"Retain ten newest images","selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":10},"action":{"type":"expire"}}]}
      RepositoryName: !Ref BackendRepositoryName

  FrontendRepository:
    Type: AWS::ECR::Repository
    Properties:
      EmptyOnDelete: true
      EncryptionConfiguration:
        EncryptionType: AES256
      ImageScanningConfiguration:
        ScanOnPush: true
      ImageTagMutability: IMMUTABLE
      LifecyclePolicy:
        LifecyclePolicyText: >-
          {"rules":[{"rulePriority":1,"description":"Expire untagged images after one day","selection":{"tagStatus":"untagged","countType":"sinceImagePushed","countUnit":"days","countNumber":1},"action":{"type":"expire"}},{"rulePriority":2,"description":"Retain ten newest images","selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":10},"action":{"type":"expire"}}]}
      RepositoryName: !Ref FrontendRepositoryName

Outputs:
  VpcId:
    Value: !Ref Vpc
  PublicSubnetAId:
    Value: !Ref PublicSubnetA
  PublicSubnetBId:
    Value: !Ref PublicSubnetB
  DatabaseSubnetAId:
    Value: !Ref DatabaseSubnetA
  DatabaseSubnetBId:
    Value: !Ref DatabaseSubnetB
  FrontendSecurityGroupId:
    Value: !Ref FrontendSecurityGroup
  BackendSecurityGroupId:
    Value: !Ref BackendSecurityGroup
  AiSecurityGroupId:
    Value: !Ref AiSecurityGroup
  DatabaseSecurityGroupId:
    Value: !Ref DatabaseSecurityGroup
  LoadBalancerArn:
    Value: !Ref LoadBalancer
  LoadBalancerDnsName:
    Value: !GetAtt LoadBalancer.DNSName
  FrontendUrl:
    Value: !If
      - HasCustomDomain
      - !Sub https://${CustomDomainName}
      - !Sub https://${FrontendDistribution.DomainName}
  FrontendDistributionId:
    Value: !Ref FrontendDistribution
  CloudFrontOriginSecretArn:
    Value: !Ref CloudFrontOriginSecret
  OriginRestrictionEnabled:
    Value: "true"
  CloudFrontOriginPrefixListId:
    Value: !If
      - HasCloudFrontOriginPrefixList
      - !Ref CloudFrontOriginPrefixListId
      - not-configured
  CustomDomainEnabled:
    Value: !If [HasCustomDomain, "true", "false"]
  OriginProtocol:
    Value: !If [HasCustomDomain, HTTPS, HTTP]
  ViewerTlsPolicy:
    Value: !If [HasCustomDomain, TLSv1.2_2021, CloudFrontDefault]
  OidcUserPoolId:
    Value: !Ref UserPool
  OidcClientId:
    Value: !Ref FrontendUserPoolClient
  OidcIssuerUrl:
    Value: !Sub https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}
  OidcJwksUrl:
    Value: !Sub https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}/.well-known/jwks.json
  OidcServerMetadataUrl:
    Value: !Sub https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}/.well-known/openid-configuration
  OidcRedirectUri:
    Value: !If
      - HasCustomDomain
      - !Sub https://${CustomDomainName}/oauth2callback
      - !Sub https://${FrontendDistribution.DomainName}/oauth2callback
  FrontendOidcCookieSecretArn:
    Value: !Ref FrontendOidcCookieSecret
  EcsClusterName:
    Value: !Ref EcsCluster
  ServiceDiscoveryNamespaceId:
    Value: !Ref ServiceDiscoveryNamespace
  TaskExecutionRoleArn:
    Value: !GetAtt TaskExecutionRole.Arn
  AppTaskRoleArn:
    Value: !GetAtt AppTaskRole.Arn
  BackendTaskRoleArn:
    Value: !GetAtt BackendTaskRole.Arn
  AiTaskRoleArn:
    Value: !GetAtt AiTaskRole.Arn
  BackendApiKeySecretArn:
    Value: !Ref BackendApiKeySecret
  AiServiceApiKeySecretArn:
    Value: !Ref AiServiceApiKeySecret
  OpenAiApiKeySecretArn:
    Value: !Ref OpenAiApiKeySecretArn
  DatabaseEndpoint:
