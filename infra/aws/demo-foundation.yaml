AWSTemplateFormatVersion: "2010-09-09"
Description: Minimum shared AWS infrastructure for the synthetic financial wellness coach demo.

Parameters:
  ProjectName:
    Type: String
    Default: ai-financial-wellness-coach
  AiRepositoryName:
    Type: String
    Default: nus-iss-ais-team9-ai
  BackendRepositoryName:
    Type: String
    Default: nus-iss-ais-team9-backend
  FrontendRepositoryName:
    Type: String
    Default: nus-iss-ais-team9-frontend
  BedrockInferenceProfileId:
    Type: String
    Default: apac.amazon.nova-lite-v1:0
  BedrockFoundationModelId:
    Type: String
    Default: amazon.nova-lite-v1:0
  EducationKnowledgeBaseId:
    Type: String
    MinLength: 10
    MaxLength: 10
  PolicyKnowledgeBaseId:
    Type: String
    MinLength: 10
    MaxLength: 10
  DatabaseInstanceClass:
    Type: String
    Default: db.t4g.micro
    AllowedValues:
      - db.t4g.micro
      - db.t3.micro
  DatabaseName:
    Type: String
    Default: financial_wellness
    AllowedPattern: "^[a-zA-Z][a-zA-Z0-9_]{0,62}$"
  DatabaseMasterUsername:
    Type: String
    Default: coachadmin
    AllowedPattern: "^[a-zA-Z][a-zA-Z0-9_]{0,62}$"

Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.42.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-vpc
        - Key: Project
          Value: !Ref ProjectName

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-igw

  InternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      InternetGatewayId: !Ref InternetGateway
      VpcId: !Ref Vpc

  PublicSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      AvailabilityZone: !Select [0, !GetAZs ""]
      CidrBlock: 10.42.0.0/24
      MapPublicIpOnLaunch: true
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-public-a

  PublicSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      AvailabilityZone: !Select [1, !GetAZs ""]
      CidrBlock: 10.42.1.0/24
      MapPublicIpOnLaunch: true
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-public-b

  DatabaseSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      AvailabilityZone: !Select [0, !GetAZs ""]
      CidrBlock: 10.42.10.0/24
      MapPublicIpOnLaunch: false
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-database-a
        - Key: Project
          Value: !Ref ProjectName

  DatabaseSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      AvailabilityZone: !Select [1, !GetAZs ""]
      CidrBlock: 10.42.11.0/24
      MapPublicIpOnLaunch: false
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-database-b
        - Key: Project
          Value: !Ref ProjectName

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-public

  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: InternetGatewayAttachment
    Properties:
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway
      RouteTableId: !Ref PublicRouteTable

  PublicSubnetARouteAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PublicRouteTable
      SubnetId: !Ref PublicSubnetA

  PublicSubnetBRouteAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PublicRouteTable
      SubnetId: !Ref PublicSubnetB

  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Public HTTP entry point for the synthetic demo
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-alb

  FrontendSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Streamlit ingress only from the ALB
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8501
          ToPort: 8501
          SourceSecurityGroupId: !Ref AlbSecurityGroup
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-frontend

  BackendSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Backend ingress from the ALB and Streamlit
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          SourceSecurityGroupId: !Ref AlbSecurityGroup
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          SourceSecurityGroupId: !Ref FrontendSecurityGroup
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-backend

  AiSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: AI service ingress only from the backend
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8001
          ToPort: 8001
          SourceSecurityGroupId: !Ref BackendSecurityGroup
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-ai

  DatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: PostgreSQL ingress only from the application backend
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref BackendSecurityGroup
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-database
        - Key: Project
          Value: !Ref ProjectName

  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      IpAddressType: ipv4
      Scheme: internet-facing
      SecurityGroups:
        - !Ref AlbSecurityGroup
      Subnets:
        - !Ref PublicSubnetA
        - !Ref PublicSubnetB
      Type: application
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  FrontendDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: !Sub HTTPS entry point for ${ProjectName}
        DefaultCacheBehavior:
          AllowedMethods:
            - DELETE
            - GET
            - HEAD
            - OPTIONS
            - PATCH
            - POST
            - PUT
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
          CachedMethods:
            - GET
            - HEAD
            - OPTIONS
          Compress: false
          OriginRequestPolicyId: 216adef6-5c7f-47e4-b989-5492eafa07d3
          TargetOriginId: application-alb
          ViewerProtocolPolicy: redirect-to-https
        Enabled: true
        HttpVersion: http2and3
        IPV6Enabled: true
        Origins:
          - CustomOriginConfig:
              HTTPPort: 80
              OriginProtocolPolicy: http-only
              OriginReadTimeout: 60
            DomainName: !GetAtt LoadBalancer.DNSName
            Id: application-alb
        PriceClass: PriceClass_200
        ViewerCertificate:
          CloudFrontDefaultCertificate: true
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: demo

  UserPool:
    Type: AWS::Cognito::UserPool
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      AutoVerifiedAttributes:
        - email
      DeletionProtection: ACTIVE
      MfaConfiguration: OPTIONAL
      EnabledMfas:
        - SOFTWARE_TOKEN_MFA
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
          RequireUppercase: true
          TemporaryPasswordValidityDays: 3
      UserPoolName: !Sub ${ProjectName}-demo-users
      UsernameAttributes:
        - email
      UserPoolTags:
        Project: !Ref ProjectName
        Environment: demo

  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Sub ${ProjectName}-${AWS::AccountId}
      UserPoolId: !Ref UserPool

  FrontendUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      AllowedOAuthFlows:
        - code
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthScopes:
        - email
        - openid
        - profile
      CallbackURLs:
        - !Sub https://${FrontendDistribution.DomainName}/oauth2callback
      ClientName: !Sub ${ProjectName}-streamlit
      DefaultRedirectURI: !Sub https://${FrontendDistribution.DomainName}/oauth2callback
      EnableTokenRevocation: true
      ExplicitAuthFlows:
        - ALLOW_REFRESH_TOKEN_AUTH
        - ALLOW_USER_SRP_AUTH
      GenerateSecret: false
      IdTokenValidity: 1
      LogoutURLs:
        - !Sub https://${FrontendDistribution.DomainName}/
      PreventUserExistenceErrors: ENABLED
      RefreshTokenValidity: 1
      SupportedIdentityProviders:
        - COGNITO
      TokenValidityUnits:
        IdToken: hours
        RefreshToken: days
      UserPoolId: !Ref UserPool

  EcsCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub ${ProjectName}-demo
      ClusterSettings:
        - Name: containerInsights
          Value: enabled
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  ServiceDiscoveryNamespace:
    Type: AWS::ServiceDiscovery::PrivateDnsNamespace
    Properties:
      Description: Private service discovery for the financial wellness coach
      Name: coach.internal
      Vpc: !Ref Vpc

  AiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /ecs/${ProjectName}/ai
      RetentionInDays: 30

  BackendLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /ecs/${ProjectName}/backend
      RetentionInDays: 30

  FrontendLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /ecs/${ProjectName}/frontend
      RetentionInDays: 30

  BackendApiKeySecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: Synthetic demo automation-to-backend API key
      GenerateSecretString:
        ExcludePunctuation: true
        GenerateStringKey: value
        PasswordLength: 40
        SecretStringTemplate: '{"purpose":"backend-automation-api-key"}'
      Name: !Sub ${ProjectName}/demo/backend-api-key

  FrontendOidcCookieSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: Streamlit OIDC identity-cookie signing secret
      GenerateSecretString:
        ExcludePunctuation: true
        GenerateStringKey: value
        PasswordLength: 64
        SecretStringTemplate: '{"purpose":"frontend-oidc-cookie"}'
      Name: !Sub ${ProjectName}/demo/frontend-oidc-cookie

  AiServiceApiKeySecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: Synthetic demo backend-to-AI API key
      GenerateSecretString:
        ExcludePunctuation: true
        GenerateStringKey: value
        PasswordLength: 40
        SecretStringTemplate: '{"purpose":"ai-service-api-key"}'
      Name: !Sub ${ProjectName}/demo/ai-service-api-key

  DatabaseSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Private database subnets for the synthetic demo
      SubnetIds:
        - !Ref DatabaseSubnetA
        - !Ref DatabaseSubnetB
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  Database:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      AllocatedStorage: "20"
      AutoMinorVersionUpgrade: true
      BackupRetentionPeriod: 1
      CopyTagsToSnapshot: true
      DBInstanceClass: !Ref DatabaseInstanceClass
      DBInstanceIdentifier: !Sub ${ProjectName}-demo
      DBName: !Ref DatabaseName
      DBSubnetGroupName: !Ref DatabaseSubnetGroup
      EnableIAMDatabaseAuthentication: false
      Engine: postgres
      ManageMasterUserPassword: true
      MasterUsername: !Ref DatabaseMasterUsername
      MaxAllocatedStorage: 100
      MultiAZ: false
      PubliclyAccessible: false
      StorageEncrypted: true
      StorageType: gp3
      VPCSecurityGroups:
        - !GetAtt DatabaseSecurityGroup.GroupId
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: demo

  TaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${ProjectName}-ecs-execution
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: ReadDemoServiceSecrets
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource:
                  - !Ref BackendApiKeySecret
                  - !Ref AiServiceApiKeySecret
                  - !Ref FrontendOidcCookieSecret
                  - !GetAtt Database.MasterUserSecret.SecretArn

  AppTaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${ProjectName}-app-task
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole

  AiTaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${ProjectName}-ai-task
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: InvokeApprovedApacBedrockProfile
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: InvokeInferenceProfile
                Effect: Allow
                Action: bedrock:InvokeModel
                Resource: !Sub arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/${BedrockInferenceProfileId}
                Condition:
                  StringEquals:
                    aws:RequestedRegion: !Ref AWS::Region
              - Sid: InvokeApacDestinationModelsThroughProfile
                Effect: Allow
                Action: bedrock:InvokeModel
                Resource:
                  - !Sub arn:${AWS::Partition}:bedrock:ap-south-1::foundation-model/${BedrockFoundationModelId}
                  - !Sub arn:${AWS::Partition}:bedrock:ap-northeast-1::foundation-model/${BedrockFoundationModelId}
                  - !Sub arn:${AWS::Partition}:bedrock:ap-northeast-2::foundation-model/${BedrockFoundationModelId}
                  - !Sub arn:${AWS::Partition}:bedrock:ap-northeast-3::foundation-model/${BedrockFoundationModelId}
                  - !Sub arn:${AWS::Partition}:bedrock:ap-southeast-1::foundation-model/${BedrockFoundationModelId}
                  - !Sub arn:${AWS::Partition}:bedrock:ap-southeast-2::foundation-model/${BedrockFoundationModelId}
                Condition:
                  StringEquals:
                    bedrock:InferenceProfileArn: !Sub arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/${BedrockInferenceProfileId}
        - PolicyName: RetrieveApprovedKnowledgeBases
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - bedrock:GetKnowledgeBase
                  - bedrock:Retrieve
                Resource:
                  - !Sub arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:knowledge-base/${EducationKnowledgeBaseId}
                  - !Sub arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:knowledge-base/${PolicyKnowledgeBaseId}

  AiRepository:
    Type: AWS::ECR::Repository
    Properties:
      EmptyOnDelete: true
      EncryptionConfiguration:
        EncryptionType: AES256
      ImageScanningConfiguration:
        ScanOnPush: true
      ImageTagMutability: IMMUTABLE
      LifecyclePolicy:
        LifecyclePolicyText: >-
          {"rules":[{"rulePriority":1,"description":"Expire untagged images after one day","selection":{"tagStatus":"untagged","countType":"sinceImagePushed","countUnit":"days","countNumber":1},"action":{"type":"expire"}},{"rulePriority":2,"description":"Retain ten newest images","selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":10},"action":{"type":"expire"}}]}
      RepositoryName: !Ref AiRepositoryName

  BackendRepository:
    Type: AWS::ECR::Repository
    Properties:
      EmptyOnDelete: true
      EncryptionConfiguration:
        EncryptionType: AES256
      ImageScanningConfiguration:
        ScanOnPush: true
      ImageTagMutability: IMMUTABLE
      LifecyclePolicy:
        LifecyclePolicyText: >-
          {"rules":[{"rulePriority":1,"description":"Expire untagged images after one day","selection":{"tagStatus":"untagged","countType":"sinceImagePushed","countUnit":"days","countNumber":1},"action":{"type":"expire"}},{"rulePriority":2,"description":"Retain ten newest images","selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":10},"action":{"type":"expire"}}]}
      RepositoryName: !Ref BackendRepositoryName

  FrontendRepository:
    Type: AWS::ECR::Repository
    Properties:
      EmptyOnDelete: true
      EncryptionConfiguration:
        EncryptionType: AES256
      ImageScanningConfiguration:
        ScanOnPush: true
      ImageTagMutability: IMMUTABLE
      LifecyclePolicy:
        LifecyclePolicyText: >-
          {"rules":[{"rulePriority":1,"description":"Expire untagged images after one day","selection":{"tagStatus":"untagged","countType":"sinceImagePushed","countUnit":"days","countNumber":1},"action":{"type":"expire"}},{"rulePriority":2,"description":"Retain ten newest images","selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":10},"action":{"type":"expire"}}]}
      RepositoryName: !Ref FrontendRepositoryName

Outputs:
  VpcId:
    Value: !Ref Vpc
  PublicSubnetAId:
    Value: !Ref PublicSubnetA
  PublicSubnetBId:
    Value: !Ref PublicSubnetB
  DatabaseSubnetAId:
    Value: !Ref DatabaseSubnetA
  DatabaseSubnetBId:
    Value: !Ref DatabaseSubnetB
  FrontendSecurityGroupId:
    Value: !Ref FrontendSecurityGroup
  BackendSecurityGroupId:
    Value: !Ref BackendSecurityGroup
  AiSecurityGroupId:
    Value: !Ref AiSecurityGroup
  DatabaseSecurityGroupId:
    Value: !Ref DatabaseSecurityGroup
  LoadBalancerArn:
    Value: !Ref LoadBalancer
  LoadBalancerDnsName:
    Value: !GetAtt LoadBalancer.DNSName
  FrontendUrl:
    Value: !Sub https://${FrontendDistribution.DomainName}
  FrontendDistributionId:
    Value: !Ref FrontendDistribution
  OidcUserPoolId:
    Value: !Ref UserPool
  OidcClientId:
    Value: !Ref FrontendUserPoolClient
  OidcIssuerUrl:
    Value: !Sub https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}
  OidcJwksUrl:
    Value: !Sub https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}/.well-known/jwks.json
  OidcServerMetadataUrl:
    Value: !Sub https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}/.well-known/openid-configuration
  OidcRedirectUri:
    Value: !Sub https://${FrontendDistribution.DomainName}/oauth2callback
  FrontendOidcCookieSecretArn:
    Value: !Ref FrontendOidcCookieSecret
  EcsClusterName:
    Value: !Ref EcsCluster
  ServiceDiscoveryNamespaceId:
    Value: !Ref ServiceDiscoveryNamespace
  TaskExecutionRoleArn:
    Value: !GetAtt TaskExecutionRole.Arn
  AppTaskRoleArn:
    Value: !GetAtt AppTaskRole.Arn
  AiTaskRoleArn:
    Value: !GetAtt AiTaskRole.Arn
  BackendApiKeySecretArn:
    Value: !Ref BackendApiKeySecret
  AiServiceApiKeySecretArn:
    Value: !Ref AiServiceApiKeySecret
  DatabaseEndpoint:
    Value: !GetAtt Database.Endpoint.Address
  DatabasePort:
    Value: !GetAtt Database.Endpoint.Port
  DatabaseName:
    Value: !Ref DatabaseName
  DatabaseSecretArn:
    Value: !GetAtt Database.MasterUserSecret.SecretArn
  AiLogGroupName:
    Value: !Ref AiLogGroup
  BackendLogGroupName:
    Value: !Ref BackendLogGroup
  FrontendLogGroupName:
    Value: !Ref FrontendLogGroup
  AiRepositoryName:
    Value: !Ref AiRepository
  BackendRepositoryName:
    Value: !Ref BackendRepository
  FrontendRepositoryName:
    Value: !Ref FrontendRepository
  AiRepositoryUri:
    Value: !GetAtt AiRepository.RepositoryUri
  BackendRepositoryUri:
    Value: !GetAtt BackendRepository.RepositoryUri
  FrontendRepositoryUri:
    Value: !GetAtt FrontendRepository.RepositoryUri
