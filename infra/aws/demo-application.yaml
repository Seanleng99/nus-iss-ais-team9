AWSTemplateFormatVersion: "2010-09-09"
Description: Three minimum-size ECS Fargate services for the synthetic financial wellness coach demo.

Parameters:
  ProjectName:
    Type: String
    Default: ai-financial-wellness-coach
  VpcId:
    Type: AWS::EC2::VPC::Id
  PublicSubnetAId:
    Type: AWS::EC2::Subnet::Id
  PublicSubnetBId:
    Type: AWS::EC2::Subnet::Id
  FrontendSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
  BackendSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
  AiSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
  LoadBalancerArn:
    Type: String
  EcsClusterName:
    Type: String
  ServiceDiscoveryNamespaceId:
    Type: String
  TaskExecutionRoleArn:
    Type: String
  AppTaskRoleArn:
    Type: String
  AiTaskRoleArn:
    Type: String
  BackendApiKeySecretArn:
    Type: String
  AiServiceApiKeySecretArn:
    Type: String
  DatabaseEndpoint:
    Type: String
  DatabasePort:
    Type: String
    Default: "5432"
  DatabaseName:
    Type: String
  DatabaseSecretArn:
    Type: String
  AiLogGroupName:
    Type: String
  BackendLogGroupName:
    Type: String
  FrontendLogGroupName:
    Type: String
  AiImageUri:
    Type: String
  BackendImageUri:
    Type: String
  FrontendImageUri:
    Type: String
  BedrockModelId:
    Type: String
    Default: apac.amazon.nova-lite-v1:0
  EducationKnowledgeBaseId:
    Type: String
    MinLength: 10
    MaxLength: 10
  AiServiceName:
    Type: String
    Default: coach-ai
  BackendServiceName:
    Type: String
    Default: coach-backend
  FrontendServiceName:
    Type: String
    Default: coach-frontend
  AlertEmail:
    Type: String
    Default: ""
    Description: Optional email subscription for operational alarms.

Conditions:
  HasAlertEmail: !Not [!Equals [!Ref AlertEmail, ""]]

Resources:
  AiDiscoveryService:
    Type: AWS::ServiceDiscovery::Service
    Properties:
      Description: Private DNS record for the AI service
      DnsConfig:
        DnsRecords:
          - TTL: 10
            Type: A
        NamespaceId: !Ref ServiceDiscoveryNamespaceId
        RoutingPolicy: MULTIVALUE
      HealthCheckCustomConfig:
        FailureThreshold: 1
      Name: ai

  BackendDiscoveryService:
    Type: AWS::ServiceDiscovery::Service
    Properties:
      Description: Private DNS record for the application backend
      DnsConfig:
        DnsRecords:
          - TTL: 10
            Type: A
        NamespaceId: !Ref ServiceDiscoveryNamespaceId
        RoutingPolicy: MULTIVALUE
      HealthCheckCustomConfig:
        FailureThreshold: 1
      Name: backend

  FrontendTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      HealthCheckEnabled: true
      HealthCheckIntervalSeconds: 30
      HealthCheckPath: /_stcore/health
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      Matcher:
        HttpCode: "200"
      Port: 8501
      Protocol: HTTP
      TargetType: ip
      UnhealthyThresholdCount: 3
      VpcId: !Ref VpcId

  BackendTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      HealthCheckEnabled: true
      HealthCheckIntervalSeconds: 30
      HealthCheckPath: /health
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      Matcher:
        HttpCode: "200"
      Port: 8080
      Protocol: HTTP
      TargetType: ip
      UnhealthyThresholdCount: 3
      VpcId: !Ref VpcId

  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref FrontendTargetGroup
      LoadBalancerArn: !Ref LoadBalancerArn
      Port: 80
      Protocol: HTTP

  BackendListenerRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      Actions:
        - Type: forward
          TargetGroupArn: !Ref BackendTargetGroup
      Conditions:
        - Field: path-pattern
          PathPatternConfig:
            Values:
              - /api/*
              - /health
      ListenerArn: !Ref HttpListener
      Priority: 10

  AiTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Cpu: "256"
      ExecutionRoleArn: !Ref TaskExecutionRoleArn
      Family: coach-ai
      Memory: "512"
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      TaskRoleArn: !Ref AiTaskRoleArn
      ContainerDefinitions:
        - Name: ai-service
          Essential: true
          Image: !Ref AiImageUri
          PortMappings:
            - ContainerPort: 8001
              Name: ai-http
              Protocol: tcp
          Environment:
            - Name: APP_ENV
              Value: demo
            - Name: AWS_REGION
              Value: !Ref AWS::Region
            - Name: MODEL_PROVIDER
              Value: bedrock
            - Name: MODEL_ID
              Value: !Ref BedrockModelId
            - Name: PROMPT_SET_VERSION
              Value: v3
            - Name: RAG_PROVIDER
              Value: bedrock
            - Name: EDUCATION_KNOWLEDGE_BASE_ID
              Value: !Ref EducationKnowledgeBaseId
            - Name: RAG_MINIMUM_SCORE
              Value: "0.6"
            - Name: ROUTER_TEMPERATURE
              Value: "0.2"
            - Name: AGENT_TEMPERATURE
              Value: "0.35"
            - Name: COMPLIANCE_TEMPERATURE
              Value: "0.1"
            - Name: MODEL_MAX_TOKENS
              Value: "800"
          Secrets:
            - Name: AI_SERVICE_API_KEY
              ValueFrom: !Sub "${AiServiceApiKeySecretArn}:value::"
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref AiLogGroupName
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: ai

  BackendTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Cpu: "256"
      ExecutionRoleArn: !Ref TaskExecutionRoleArn
      Family: coach-backend
      Memory: "512"
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      TaskRoleArn: !Ref AppTaskRoleArn
      ContainerDefinitions:
        - Name: backend
          Essential: true
          Image: !Ref BackendImageUri
          PortMappings:
            - ContainerPort: 8080
              Name: backend-http
              Protocol: tcp
          Environment:
            - Name: APP_ENV
              Value: demo
            - Name: AI_SERVICE_BASE_URL
              Value: http://ai.coach.internal:8001
            - Name: AI_SERVICE_TIMEOUT_SECONDS
              Value: "45"
            - Name: TRACE_RETENTION_DAYS
              Value: "30"
            - Name: POSTGRES_HOST
              Value: !Ref DatabaseEndpoint
            - Name: POSTGRES_PORT
              Value: !Ref DatabasePort
            - Name: POSTGRES_DB
              Value: !Ref DatabaseName
            - Name: POSTGRES_SSLMODE
              Value: require
          Secrets:
            - Name: BACKEND_API_KEY
              ValueFrom: !Sub "${BackendApiKeySecretArn}:value::"
            - Name: AI_SERVICE_API_KEY
              ValueFrom: !Sub "${AiServiceApiKeySecretArn}:value::"
            - Name: POSTGRES_USER
              ValueFrom: !Sub "${DatabaseSecretArn}:username::"
            - Name: POSTGRES_PASSWORD
              ValueFrom: !Sub "${DatabaseSecretArn}:password::"
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref BackendLogGroupName
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: backend

  FrontendTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Cpu: "256"
      ExecutionRoleArn: !Ref TaskExecutionRoleArn
      Family: coach-frontend
      Memory: "512"
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      TaskRoleArn: !Ref AppTaskRoleArn
      ContainerDefinitions:
        - Name: frontend
          Essential: true
          Image: !Ref FrontendImageUri
          PortMappings:
            - ContainerPort: 8501
              Name: frontend-http
              Protocol: tcp
          Environment:
            - Name: APP_ENV
              Value: demo
            - Name: BACKEND_BASE_URL
              Value: http://backend.coach.internal:8080
          Secrets:
            - Name: BACKEND_API_KEY
              ValueFrom: !Sub "${BackendApiKeySecretArn}:value::"
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref FrontendLogGroupName
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: frontend

  AiService:
    Type: AWS::ECS::Service
    Properties:
      Cluster: !Ref EcsClusterName
      DeploymentConfiguration:
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
        MaximumPercent: 200
        MinimumHealthyPercent: 0
      DesiredCount: 1
      EnableECSManagedTags: true
      LaunchType: FARGATE
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          SecurityGroups:
            - !Ref AiSecurityGroupId
          Subnets:
            - !Ref PublicSubnetAId
            - !Ref PublicSubnetBId
      PropagateTags: SERVICE
      ServiceName: !Ref AiServiceName
      ServiceRegistries:
        - RegistryArn: !GetAtt AiDiscoveryService.Arn
      TaskDefinition: !Ref AiTaskDefinition
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  BackendService:
    Type: AWS::ECS::Service
    DependsOn: BackendListenerRule
    Properties:
      Cluster: !Ref EcsClusterName
      DeploymentConfiguration:
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
        MaximumPercent: 200
        MinimumHealthyPercent: 0
      DesiredCount: 1
      EnableECSManagedTags: true
      HealthCheckGracePeriodSeconds: 60
      LaunchType: FARGATE
      LoadBalancers:
        - ContainerName: backend
          ContainerPort: 8080
          TargetGroupArn: !Ref BackendTargetGroup
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          SecurityGroups:
            - !Ref BackendSecurityGroupId
          Subnets:
            - !Ref PublicSubnetAId
            - !Ref PublicSubnetBId
      PropagateTags: SERVICE
      ServiceName: !Ref BackendServiceName
      ServiceRegistries:
        - RegistryArn: !GetAtt BackendDiscoveryService.Arn
      TaskDefinition: !Ref BackendTaskDefinition
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  FrontendService:
    Type: AWS::ECS::Service
    DependsOn: HttpListener
    Properties:
      Cluster: !Ref EcsClusterName
      DeploymentConfiguration:
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
        MaximumPercent: 200
        MinimumHealthyPercent: 0
      DesiredCount: 1
      EnableECSManagedTags: true
      HealthCheckGracePeriodSeconds: 90
      LaunchType: FARGATE
      LoadBalancers:
        - ContainerName: frontend
          ContainerPort: 8501
          TargetGroupArn: !Ref FrontendTargetGroup
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          SecurityGroups:
            - !Ref FrontendSecurityGroupId
          Subnets:
            - !Ref PublicSubnetAId
            - !Ref PublicSubnetBId
      PropagateTags: SERVICE
      ServiceName: !Ref FrontendServiceName
      TaskDefinition: !Ref FrontendTaskDefinition
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  AiScalableTarget:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    Properties:
      MaxCapacity: 2
      MinCapacity: 1
      ResourceId: !Sub service/${EcsClusterName}/${AiService.Name}
      ScalableDimension: ecs:service:DesiredCount
      ServiceNamespace: ecs

  AiCpuScalingPolicy:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: !Sub ${ProjectName}-ai-cpu-target
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref AiScalableTarget
      TargetTrackingScalingPolicyConfiguration:
        PredefinedMetricSpecification:
          PredefinedMetricType: ECSServiceAverageCPUUtilization
        ScaleInCooldown: 300
        ScaleOutCooldown: 60
        TargetValue: 70

  BackendScalableTarget:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    Properties:
      MaxCapacity: 2
      MinCapacity: 1
      ResourceId: !Sub service/${EcsClusterName}/${BackendService.Name}
      ScalableDimension: ecs:service:DesiredCount
      ServiceNamespace: ecs

  BackendCpuScalingPolicy:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: !Sub ${ProjectName}-backend-cpu-target
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref BackendScalableTarget
      TargetTrackingScalingPolicyConfiguration:
        PredefinedMetricSpecification:
          PredefinedMetricType: ECSServiceAverageCPUUtilization
        ScaleInCooldown: 300
        ScaleOutCooldown: 60
        TargetValue: 70

  OperationalAlertsTopic:
    Type: AWS::SNS::Topic
    Properties:
      DisplayName: Financial coach operational alerts
      TopicName: !Sub ${ProjectName}-demo-operational-alerts

  OperationalAlertEmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlertEmail
    Properties:
      Endpoint: !Ref AlertEmail
      Protocol: email
      TopicArn: !Ref OperationalAlertsTopic

  OperationalAlertsTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowEcsDeploymentEvents
            Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sns:Publish
            Resource: !Ref OperationalAlertsTopic
      Topics:
        - !Ref OperationalAlertsTopic

  EcsDeploymentFailureRule:
    Type: AWS::Events::Rule
    Properties:
      Description: Notify when an ECS service deployment fails.
      EventPattern:
        source:
          - aws.ecs
        detail-type:
          - ECS Deployment State Change
        detail:
          eventType:
            - ERROR
          eventName:
            - SERVICE_DEPLOYMENT_FAILED
          clusterArn:
            - !Sub arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:cluster/${EcsClusterName}
      State: ENABLED
      Targets:
        - Arn: !Ref OperationalAlertsTopic
          Id: operational-alerts

  AiGenerationFailureMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      FilterName: !Sub ${ProjectName}-ai-generation-failures
      FilterPattern: '"coach_generation_failed"'
      LogGroupName: !Ref AiLogGroupName
      MetricTransformations:
        - MetricName: CoachGenerationFailures
          MetricNamespace: !Sub ${ProjectName}/Application
          MetricValue: "1"
          Unit: Count

  BackendTarget5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${ProjectName}-demo-backend-5xx
      AlarmDescription: Backend target returned at least two 5xx responses in five minutes.
      Namespace: AWS/ApplicationELB
      MetricName: HTTPCode_Target_5XX_Count
      Dimensions:
        - Name: LoadBalancer
          Value:
            Fn::Select:
              - 1
              - Fn::Split:
                  - loadbalancer/
                  - !Ref LoadBalancerArn
        - Name: TargetGroup
          Value: !GetAtt BackendTargetGroup.TargetGroupFullName
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 2
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref OperationalAlertsTopic
      OKActions:
        - !Ref OperationalAlertsTopic

  BackendUnhealthyHostAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${ProjectName}-demo-backend-unhealthy-host
      AlarmDescription: At least one backend target is unhealthy.
      Namespace: AWS/ApplicationELB
      MetricName: UnHealthyHostCount
      Dimensions:
        - Name: LoadBalancer
          Value:
            Fn::Select:
              - 1
              - Fn::Split:
                  - loadbalancer/
                  - !Ref LoadBalancerArn
        - Name: TargetGroup
          Value: !GetAtt BackendTargetGroup.TargetGroupFullName
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref OperationalAlertsTopic
      OKActions:
        - !Ref OperationalAlertsTopic

  AiGenerationFailureAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${ProjectName}-demo-ai-generation-failure
      AlarmDescription: The AI service logged a model or retrieval generation failure.
      Namespace: !Sub ${ProjectName}/Application
      MetricName: CoachGenerationFailures
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref OperationalAlertsTopic
      OKActions:
        - !Ref OperationalAlertsTopic

  BedrockThrottlesAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${ProjectName}-demo-bedrock-throttles
      AlarmDescription: Bedrock throttled at least one model invocation.
      Namespace: AWS/Bedrock
      MetricName: InvocationThrottles
      Dimensions:
        - Name: ModelId
          Value: !Ref BedrockModelId
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref OperationalAlertsTopic
      OKActions:
        - !Ref OperationalAlertsTopic

  BedrockServerErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${ProjectName}-demo-bedrock-server-errors
      AlarmDescription: Bedrock returned at least one server error.
      Namespace: AWS/Bedrock
      MetricName: InvocationServerErrors
      Dimensions:
        - Name: ModelId
          Value: !Ref BedrockModelId
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref OperationalAlertsTopic
      OKActions:
        - !Ref OperationalAlertsTopic

  BedrockLatencyAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${ProjectName}-demo-bedrock-p95-latency
      AlarmDescription: Bedrock p95 invocation latency exceeded five seconds.
      Namespace: AWS/Bedrock
      MetricName: InvocationLatency
      Dimensions:
        - Name: ModelId
          Value: !Ref BedrockModelId
      ExtendedStatistic: p95
      Period: 300
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      Threshold: 5000
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref OperationalAlertsTopic
      OKActions:
        - !Ref OperationalAlertsTopic

  AiCpuAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${ProjectName}-demo-ai-high-cpu
      AlarmDescription: AI service average CPU utilization stayed above 80 percent.
      Namespace: AWS/ECS
      MetricName: CPUUtilization
      Dimensions:
        - Name: ClusterName
          Value: !Ref EcsClusterName
        - Name: ServiceName
          Value: !GetAtt AiService.Name
      Statistic: Average
      Period: 300
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      Threshold: 80
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref OperationalAlertsTopic
      OKActions:
        - !Ref OperationalAlertsTopic

  OperationalDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub ${ProjectName}-demo-operational
      DashboardBody:
        Fn::Sub:
          - |
            {
              "widgets": [
                {
                  "type": "metric",
                  "x": 0,
                  "y": 0,
                  "width": 12,
                  "height": 6,
                  "properties": {
                    "title": "ECS service CPU and memory",
                    "region": "${AWS::Region}",
                    "period": 300,
                    "stat": "Average",
                    "metrics": [
                      ["AWS/ECS", "CPUUtilization", "ClusterName", "${EcsClusterName}", "ServiceName", "${AiServiceName}"],
                      [".", "MemoryUtilization", ".", ".", ".", "."],
                      ["AWS/ECS", "CPUUtilization", "ClusterName", "${EcsClusterName}", "ServiceName", "${BackendServiceName}"],
                      [".", "MemoryUtilization", ".", ".", ".", "."]
                    ]
                  }
                },
                {
                  "type": "metric",
                  "x": 12,
                  "y": 0,
                  "width": 12,
                  "height": 6,
                  "properties": {
                    "title": "Backend ALB health and latency",
                    "region": "${AWS::Region}",
                    "period": 300,
                    "metrics": [
                      ["AWS/ApplicationELB", "HTTPCode_Target_5XX_Count", "LoadBalancer", "${LoadBalancerFullName}", "TargetGroup", "${BackendTargetGroupFullName}", {"stat": "Sum"}],
                      [".", "TargetResponseTime", ".", ".", ".", ".", {"stat": "p95"}],
                      [".", "UnHealthyHostCount", ".", ".", ".", ".", {"stat": "Maximum"}]
                    ]
                  }
                },
                {
                  "type": "metric",
                  "x": 0,
                  "y": 6,
                  "width": 12,
                  "height": 6,
                  "properties": {
                    "title": "Bedrock invocations, errors, and throttles",
                    "region": "${AWS::Region}",
                    "period": 300,
                    "metrics": [
                      ["AWS/Bedrock", "Invocations", "ModelId", "${BedrockModelId}", {"stat": "Sum"}],
                      [".", "InvocationClientErrors", ".", ".", {"stat": "Sum"}],
                      [".", "InvocationServerErrors", ".", ".", {"stat": "Sum"}],
                      [".", "InvocationThrottles", ".", ".", {"stat": "Sum"}],
                      [".", "InvocationLatency", ".", ".", {"stat": "p95", "yAxis": "right"}]
                    ]
                  }
                },
                {
                  "type": "metric",
                  "x": 12,
                  "y": 6,
                  "width": 12,
                  "height": 6,
                  "properties": {
                    "title": "Token usage and application generation failures",
                    "region": "${AWS::Region}",
                    "period": 300,
                    "metrics": [
                      ["AWS/Bedrock", "InputTokenCount", "ModelId", "${BedrockModelId}", {"stat": "Sum"}],
                      [".", "OutputTokenCount", ".", ".", {"stat": "Sum"}],
                      ["${ProjectName}/Application", "CoachGenerationFailures", {"stat": "Sum"}]
                    ]
                  }
                }
              ]
            }
          - LoadBalancerFullName:
              Fn::Select:
                - 1
                - Fn::Split:
                    - loadbalancer/
                    - !Ref LoadBalancerArn
            BackendTargetGroupFullName: !GetAtt BackendTargetGroup.TargetGroupFullName

Outputs:
  AiServiceName:
    Value: !GetAtt AiService.Name
  BackendServiceName:
    Value: !GetAtt BackendService.Name
  FrontendServiceName:
    Value: !GetAtt FrontendService.Name
  AiTaskFamily:
    Value: coach-ai
  BackendTaskFamily:
    Value: coach-backend
  FrontendTaskFamily:
    Value: coach-frontend
  AiContainerName:
    Value: ai-service
  BackendContainerName:
    Value: backend
  FrontendContainerName:
    Value: frontend
  OperationalDashboardName:
    Value: !Ref OperationalDashboard
  OperationalAlertsTopicArn:
    Value: !Ref OperationalAlertsTopic
  OperationalAlarmPrefix:
    Value: !Sub ${ProjectName}-demo-
  BedrockModelId:
    Value: !Ref BedrockModelId
