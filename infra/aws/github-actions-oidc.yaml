AWSTemplateFormatVersion: "2010-09-09"
Description: Least-privilege GitHub Actions OIDC roles for the financial wellness coach pipeline.

Parameters:
  ExistingGitHubOidcProviderArn:
    Type: String
    Default: ""
    Description: Existing token.actions.githubusercontent.com provider ARN; leave blank to create it.
  PublishSubjectClaim:
    Type: String
    Description: Exact GitHub OIDC sub claim allowed to publish main-branch images.
  DeploySubjectClaim:
    Type: String
    Description: Exact GitHub OIDC sub claim for the demo environment.
  EcrAiRepository:
    Type: String
  EcrBackendRepository:
    Type: String
  EcrFrontendRepository:
    Type: String
  EcsClusterName:
    Type: String
  EcsAiServiceName:
    Type: String
  EcsBackendServiceName:
    Type: String
  EcsFrontendServiceName:
    Type: String
  EcsBackendTaskFamily:
    Type: String
  EcsTaskExecutionRoleArn:
    Type: String
  EcsAppTaskRoleArn:
    Type: String
  EcsAiTaskRoleArn:
    Type: String
  BedrockBaselineInferenceProfileId:
    Type: String
    Default: apac.amazon.nova-lite-v1:0
  BedrockBaselineFoundationModelId:
    Type: String
    Default: amazon.nova-lite-v1:0
  BedrockCandidateInferenceProfileId:
    Type: String
    Default: apac.amazon.nova-micro-v1:0
  BedrockCandidateFoundationModelId:
    Type: String
    Default: amazon.nova-micro-v1:0
  EducationKnowledgeBaseId:
    Type: String
    MinLength: 10
    MaxLength: 10
  EducationSourceBucketName:
    Type: String
  EducationSourcePrefix:
    Type: String
    Default: investment-education/documents/
  PolicyKnowledgeBaseId:
    Type: String
    MinLength: 10
    MaxLength: 10
  PolicySourceBucketName:
    Type: String
  PolicySourcePrefix:
    Type: String
    Default: policy-controls/documents/

Conditions:
  CreateGitHubOidcProvider: !Equals [!Ref ExistingGitHubOidcProviderArn, ""]

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateGitHubOidcProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      Tags:
        - Key: Project
          Value: ai-financial-wellness-coach

  PublishRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: ai-financial-wellness-coach-github-publish
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - CreateGitHubOidcProvider
                - !Ref GitHubOidcProvider
                - !Ref ExistingGitHubOidcProviderArn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Ref PublishSubjectClaim
      Policies:
        - PolicyName: PublishAndScanImages
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:CompleteLayerUpload
                  - ecr:DescribeImageScanFindings
                  - ecr:DescribeImages
                  - ecr:GetDownloadUrlForLayer
                  - ecr:InitiateLayerUpload
                  - ecr:PutImage
                  - ecr:UploadLayerPart
                Resource:
                  - !Sub arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/${EcrAiRepository}
                  - !Sub arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/${EcrBackendRepository}
                  - !Sub arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/${EcrFrontendRepository}
              - Effect: Allow
                Action: inspector2:ListFindings
                Resource: "*"

  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: ai-financial-wellness-coach-github-deploy
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - CreateGitHubOidcProvider
                - !Ref GitHubOidcProvider
                - !Ref ExistingGitHubOidcProviderArn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Ref DeploySubjectClaim
      Policies:
        - PolicyName: DeployApplication
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - ecs:DescribeServices
                  - ecs:DescribeTasks
                  - ecs:DescribeTaskDefinition
                  - ecs:RegisterTaskDefinition
                  - ecs:TagResource
                Resource: "*"
              - Effect: Allow
                Action:
                  - application-autoscaling:DescribeScalableTargets
                  - application-autoscaling:DescribeScalingPolicies
                  - cloudwatch:DescribeAlarms
                  - cloudwatch:GetDashboard
                  - cloudwatch:GetMetricData
                  - cloudwatch:ListMetrics
                  - logs:DescribeLogGroups
                Resource: "*"
              - Effect: Allow
                Action: ecs:RunTask
                Resource: !Sub arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:task-definition/${EcsBackendTaskFamily}:*
                Condition:
                  ArnEquals:
                    ecs:cluster: !Sub arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:cluster/${EcsClusterName}
              - Effect: Allow
                Action: ecs:UpdateService
                Resource:
                  - !Sub arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:service/${EcsClusterName}/${EcsAiServiceName}
                  - !Sub arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:service/${EcsClusterName}/${EcsBackendServiceName}
                  - !Sub arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:service/${EcsClusterName}/${EcsFrontendServiceName}
              - Effect: Allow
                Action: iam:PassRole
                Resource:
                  - !Ref EcsTaskExecutionRoleArn
                  - !Ref EcsAppTaskRoleArn
                  - !Ref EcsAiTaskRoleArn
                Condition:
                  StringEquals:
                    iam:PassedToService: ecs-tasks.amazonaws.com
        - PolicyName: CompareApprovedBedrockModels
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: InspectApprovedBaselineProfile
                Effect: Allow
                Action: bedrock:GetInferenceProfile
                Resource: !Sub arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/${BedrockBaselineInferenceProfileId}
              - Sid: InvokeApprovedBaselineProfile
                Effect: Allow
                Action: bedrock:InvokeModel
                Resource: !Sub arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/${BedrockBaselineInferenceProfileId}
                Condition:
                  StringEquals:
                    aws:RequestedRegion: !Ref AWS::Region
              - Sid: InvokeApprovedBaselineDestinations
                Effect: Allow
                Action: bedrock:InvokeModel
                Resource:
                  - !Sub arn:${AWS::Partition}:bedrock:ap-south-1::foundation-model/${BedrockBaselineFoundationModelId}
                  - !Sub arn:${AWS::Partition}:bedrock:ap-northeast-1::foundation-model/${BedrockBaselineFoundationModelId}
                  - !Sub arn:${AWS::Partition}:bedrock:ap-northeast-2::foundation-model/${BedrockBaselineFoundationModelId}
                  - !Sub arn:${AWS::Partition}:bedrock:ap-northeast-3::foundation-model/${BedrockBaselineFoundationModelId}
                  - !Sub arn:${AWS::Partition}:bedrock:ap-southeast-1::foundation-model/${BedrockBaselineFoundationModelId}
                  - !Sub arn:${AWS::Partition}:bedrock:ap-southeast-2::foundation-model/${BedrockBaselineFoundationModelId}
                Condition:
                  StringEquals:
                    bedrock:InferenceProfileArn: !Sub arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/${BedrockBaselineInferenceProfileId}
              - Sid: InspectApprovedCandidateProfile
                Effect: Allow
                Action: bedrock:GetInferenceProfile
                Resource: !Sub arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/${BedrockCandidateInferenceProfileId}
              - Sid: InvokeApprovedCandidateProfile
                Effect: Allow
                Action: bedrock:InvokeModel
                Resource: !Sub arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/${BedrockCandidateInferenceProfileId}
                Condition:
                  StringEquals:
                    aws:RequestedRegion: !Ref AWS::Region
              - Sid: InvokeApprovedCandidateDestinations
                Effect: Allow
                Action: bedrock:InvokeModel
                Resource:
                  - !Sub arn:${AWS::Partition}:bedrock:ap-south-1::foundation-model/${BedrockCandidateFoundationModelId}
                  - !Sub arn:${AWS::Partition}:bedrock:ap-northeast-1::foundation-model/${BedrockCandidateFoundationModelId}
                  - !Sub arn:${AWS::Partition}:bedrock:ap-northeast-2::foundation-model/${BedrockCandidateFoundationModelId}
                  - !Sub arn:${AWS::Partition}:bedrock:ap-northeast-3::foundation-model/${BedrockCandidateFoundationModelId}
                  - !Sub arn:${AWS::Partition}:bedrock:ap-southeast-1::foundation-model/${BedrockCandidateFoundationModelId}
                  - !Sub arn:${AWS::Partition}:bedrock:ap-southeast-2::foundation-model/${BedrockCandidateFoundationModelId}
                Condition:
                  StringEquals:
                    bedrock:InferenceProfileArn: !Sub arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/${BedrockCandidateInferenceProfileId}
        - PolicyName: AuditGovernedRagCorpora
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: InspectApprovedKnowledgeBase
                Effect: Allow
                Action:
                  - bedrock:GetKnowledgeBase
                  - bedrock:GetDataSource
                  - bedrock:ListIngestionJobs
                Resource: !Sub arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:knowledge-base/${EducationKnowledgeBaseId}
              - Sid: ListApprovedEducationPrefix
                Effect: Allow
                Action: s3:ListBucket
                Resource: !Sub arn:${AWS::Partition}:s3:::${EducationSourceBucketName}
                Condition:
                  StringLike:
                    s3:prefix: !Sub ${EducationSourcePrefix}*
              - Sid: ReadApprovedEducationObjects
                Effect: Allow
                Action: s3:GetObject
                Resource: !Sub arn:${AWS::Partition}:s3:::${EducationSourceBucketName}/${EducationSourcePrefix}*
              - Sid: InspectApprovedPolicyKnowledgeBase
                Effect: Allow
                Action:
                  - bedrock:GetKnowledgeBase
                  - bedrock:GetDataSource
                  - bedrock:ListIngestionJobs
                Resource: !Sub arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:knowledge-base/${PolicyKnowledgeBaseId}
              - Sid: ListApprovedPolicyPrefix
                Effect: Allow
                Action: s3:ListBucket
                Resource: !Sub arn:${AWS::Partition}:s3:::${PolicySourceBucketName}
                Condition:
                  StringLike:
                    s3:prefix: !Sub ${PolicySourcePrefix}*
              - Sid: ReadApprovedPolicyObjects
                Effect: Allow
                Action: s3:GetObject
                Resource: !Sub arn:${AWS::Partition}:s3:::${PolicySourceBucketName}/${PolicySourcePrefix}*

Outputs:
  PublishRoleArn:
    Value: !GetAtt PublishRole.Arn
  DeployRoleArn:
    Value: !GetAtt DeployRole.Arn
