AWSTemplateFormatVersion: "2010-09-09"
Description: Least-privilege GitHub Actions OIDC roles for the financial wellness coach pipeline.

Parameters:
  ExistingGitHubOidcProviderArn:
    Type: String
    Default: ""
    Description: Existing token.actions.githubusercontent.com provider ARN; leave blank to create it.
  PublishSubjectClaim:
    Type: String
    Description: Exact GitHub OIDC sub claim allowed to publish main-branch images.
  DeploySubjectClaim:
    Type: String
    Description: Exact GitHub OIDC sub claim for the demo environment.
  EcrAiRepository:
    Type: String
  EcrBackendRepository:
    Type: String
  EcrFrontendRepository:
    Type: String
  EcsClusterName:
    Type: String
  EcsAiServiceName:
    Type: String
  EcsBackendServiceName:
    Type: String
  EcsFrontendServiceName:
    Type: String
  EcsBackendTaskFamily:
    Type: String
  EcsTaskExecutionRoleArn:
    Type: String
  EcsAppTaskRoleArn:
    Type: String
  EcsBackendTaskRoleArn:
    Type: String
    Default: ""
    AllowedPattern: "^$|^arn:aws:iam::[0-9]{12}:role/.+$"
  EcsAiTaskRoleArn:
    Type: String
  EducationKnowledgeBaseId:
    Type: String
    AllowedPattern: "^[A-Za-z0-9]{10}$"
  PolicyKnowledgeBaseId:
    Type: String
    AllowedPattern: "^[A-Za-z0-9]{10}$"
  EducationSourceBucketName:
    Type: String
  PolicySourceBucketName:
    Type: String
  EducationSourcePrefix:
    Type: String
    Default: investment-education/documents/
  PolicySourcePrefix:
    Type: String
    Default: policy-controls/documents/
  KnowledgeBaseRegion:
    Type: String
    Default: ""
    AllowedPattern: "^$|^[a-z]{2}(-[a-z]+)+-[0-9]$"
    Description: Region of the governed knowledge bases when it differs from this stack's region.
  OperationalAlertsTopicArn:
    Type: String
    AllowedPattern: "^arn:[a-z0-9-]+:sns:[a-z0-9-]+:[0-9]{12}:[A-Za-z0-9_-]{1,256}$"
  DriftAiLogGroupName:
    Type: String
    Default: /ecs/ai-financial-wellness-coach/ai
    AllowedPattern: "^[A-Za-z0-9_./-]{1,512}$"

Conditions:
  HasBackendTaskRole: !Not [!Equals [!Ref EcsBackendTaskRoleArn, ""]]
  CreateGitHubOidcProvider: !Equals [!Ref ExistingGitHubOidcProviderArn, ""]
  HasKnowledgeBaseRegion: !Not [!Equals [!Ref KnowledgeBaseRegion, ""]]

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateGitHubOidcProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      Tags:
        - Key: Project
          Value: ai-financial-wellness-coach

  PublishRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: ai-financial-wellness-coach-github-publish
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - CreateGitHubOidcProvider
                - !Ref GitHubOidcProvider
                - !Ref ExistingGitHubOidcProviderArn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Ref PublishSubjectClaim
      Policies:
        - PolicyName: PublishAndScanImages
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:CompleteLayerUpload
                  - ecr:DescribeImageScanFindings
                  - ecr:DescribeImages
                  - ecr:GetDownloadUrlForLayer
                  - ecr:InitiateLayerUpload
                  - ecr:PutImage
                  - ecr:UploadLayerPart
                Resource:
                  - !Sub arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/${EcrAiRepository}
                  - !Sub arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/${EcrBackendRepository}
                  - !Sub arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/${EcrFrontendRepository}
              - Effect: Allow
                Action: inspector2:ListFindings
                Resource: "*"

  RagGovernanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: ai-financial-wellness-coach-github-rag-governance
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If [CreateGitHubOidcProvider, !Ref GitHubOidcProvider, !Ref ExistingGitHubOidcProviderArn]
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Ref PublishSubjectClaim

  GovernedCorpusReadPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Roles: [!Ref DeployRole, !Ref RagGovernanceRole]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - bedrock:GetKnowledgeBase
              - bedrock:GetDataSource
              - bedrock:ListDataSources
              - bedrock:GetIngestionJob
              - bedrock:ListIngestionJobs
              - bedrock:Retrieve
            Resource:
              - !Sub
                - arn:${AWS::Partition}:bedrock:${KnowledgeBaseRegionName}:${AWS::AccountId}:knowledge-base/${EducationKnowledgeBaseId}
                - KnowledgeBaseRegionName: !If [HasKnowledgeBaseRegion, !Ref KnowledgeBaseRegion, !Ref AWS::Region]
              - !Sub
                - arn:${AWS::Partition}:bedrock:${KnowledgeBaseRegionName}:${AWS::AccountId}:knowledge-base/${PolicyKnowledgeBaseId}
                - KnowledgeBaseRegionName: !If [HasKnowledgeBaseRegion, !Ref KnowledgeBaseRegion, !Ref AWS::Region]
          - Effect: Allow
            Action: s3:GetObject
            Resource:
              - !Sub arn:${AWS::Partition}:s3:::${EducationSourceBucketName}/${EducationSourcePrefix}*
              - !Sub arn:${AWS::Partition}:s3:::${PolicySourceBucketName}/${PolicySourcePrefix}*
          - Effect: Allow
            Action: s3:ListBucket
            Resource: !Sub arn:${AWS::Partition}:s3:::${EducationSourceBucketName}
            Condition:
              StringLike:
                s3:prefix: [!Ref EducationSourcePrefix, !Sub "${EducationSourcePrefix}*"]
          - Effect: Allow
            Action: s3:ListBucket
            Resource: !Sub arn:${AWS::Partition}:s3:::${PolicySourceBucketName}
            Condition:
              StringLike:
                s3:prefix: [!Ref PolicySourcePrefix, !Sub "${PolicySourcePrefix}*"]

  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: ai-financial-wellness-coach-github-deploy
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - CreateGitHubOidcProvider
                - !Ref GitHubOidcProvider
                - !Ref ExistingGitHubOidcProviderArn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Ref DeploySubjectClaim
      Policies:
        - PolicyName: PublishApprovedCorpora
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: bedrock:StartIngestionJob
                Resource:
                  - !Sub
                    - arn:${AWS::Partition}:bedrock:${KnowledgeBaseRegionName}:${AWS::AccountId}:knowledge-base/${EducationKnowledgeBaseId}
                    - KnowledgeBaseRegionName: !If [HasKnowledgeBaseRegion, !Ref KnowledgeBaseRegion, !Ref AWS::Region]
                  - !Sub
                    - arn:${AWS::Partition}:bedrock:${KnowledgeBaseRegionName}:${AWS::AccountId}:knowledge-base/${PolicyKnowledgeBaseId}
                    - KnowledgeBaseRegionName: !If [HasKnowledgeBaseRegion, !Ref KnowledgeBaseRegion, !Ref AWS::Region]
              - Effect: Allow
                Action: s3:PutObject
                Resource:
                  - !Sub arn:${AWS::Partition}:s3:::${EducationSourceBucketName}/${EducationSourcePrefix}*
                  - !Sub arn:${AWS::Partition}:s3:::${PolicySourceBucketName}/${PolicySourcePrefix}*
        - PolicyName: DeployApplication
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - ecs:DescribeServices
                  - ecs:DescribeTasks
                  - ecs:DescribeTaskDefinition
                  - ecs:RegisterTaskDefinition
                  - ecs:TagResource
                Resource: "*"
              - Effect: Allow
                Action:
                  - application-autoscaling:DescribeScalableTargets
                  - application-autoscaling:DescribeScalingPolicies
                  - cloudwatch:DescribeAlarms
                  - cloudwatch:GetDashboard
                  - cloudwatch:GetMetricData
                  - cloudwatch:ListMetrics
                  - logs:DescribeLogGroups
                Resource: "*"
              - Sid: InspectOperationalAlertSubscriptions
                Effect: Allow
                Action: sns:ListSubscriptionsByTopic
                Resource: !Ref OperationalAlertsTopicArn
              - Sid: PublishModelDriftAlerts
                Effect: Allow
                Action: sns:Publish
                Resource: !Ref OperationalAlertsTopicArn
              - Sid: QueryDriftAggregates
                Effect: Allow
                Action: logs:StartQuery
                Resource: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:${DriftAiLogGroupName}:*
              - Sid: ReadDriftQueryResults
                Effect: Allow
                Action: [logs:GetQueryResults, logs:StopQuery]
                Resource: "*"
              - Effect: Allow
                Action: ecs:RunTask
                Resource: !Sub arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:task-definition/${EcsBackendTaskFamily}:*
                Condition:
                  ArnEquals:
                    ecs:cluster: !Sub arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:cluster/${EcsClusterName}
              - Effect: Allow
                Action: ecs:UpdateService
                Resource:
                  - !Sub arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:service/${EcsClusterName}/${EcsAiServiceName}
                  - !Sub arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:service/${EcsClusterName}/${EcsBackendServiceName}
                  - !Sub arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:service/${EcsClusterName}/${EcsFrontendServiceName}
              - Effect: Allow
                Action: iam:PassRole
                Resource:
                  - !Ref EcsTaskExecutionRoleArn
                  - !Ref EcsAppTaskRoleArn
                  - !If [HasBackendTaskRole, !Ref EcsBackendTaskRoleArn, !Ref AWS::NoValue]
                  - !Ref EcsAiTaskRoleArn
                Condition:
                  StringEquals:
                    iam:PassedToService: ecs-tasks.amazonaws.com

Outputs:
  RagGovernanceRoleArn:
    Value: !GetAtt RagGovernanceRole.Arn
  PublishRoleArn:
    Value: !GetAtt PublishRole.Arn
  DeployRoleArn:
    Value: !GetAtt DeployRole.Arn
