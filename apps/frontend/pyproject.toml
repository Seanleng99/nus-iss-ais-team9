[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-financial-wellness-coach-frontend"
version = "0.1.0"
description = "Streamlit interface for the AI Financial Wellness Coach"
requires-python = ">=3.11"
dependencies = [
  "coach-i18n==0.1.0",
  "Authlib>=1.3.2,<2",
  "httpx>=0.27",
  "pandas>=2.2",
  "plotly>=5.24",
  "starlette>=1.3.1,<2",
  "streamlit>=1.61.1,<1.66",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "ruff==0.16.10",
]

[tool.setuptools]
py-modules = ["client", "entrypoint"]

[tool.setuptools.packages.find]
include = ["ui*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
