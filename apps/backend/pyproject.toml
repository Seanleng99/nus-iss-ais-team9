[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-financial-wellness-coach-backend"
version = "0.1.0"
description = "Application API for the AI Financial Wellness Coach"
requires-python = ">=3.11"
dependencies = [
  "coach-i18n==0.1.0",
  "alembic>=1.16,<2",
  "boto3>=1.35",
  "fastapi>=0.111",
  "httpx>=0.27",
  "PyJWT[crypto]>=2.10,<3",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "psycopg[binary]>=3.2,<4",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "ruff==0.17.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "../.."]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["migrations*"]

[tool.setuptools.package-data]
app = ["policies/*.json"]

[tool.ruff]
line-length = 100
