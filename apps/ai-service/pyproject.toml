[project]
name = "ai-financial-wellness-coach-ai-service"
version = "0.1.0"
description = "Multi-agent AI service skeleton for AI Financial Wellness Coach"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "langgraph>=0.2",
  "boto3>=1.35",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27",
  "pytest>=8.2",
  "ruff>=0.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["prompts*"]

[tool.ruff]
line-length = 100
