[project]
name = "ai-financial-wellness-coach-ai-service"
version = "0.2.1"
description = "Multi-agent AI service skeleton for AI Financial Wellness Coach"
requires-python = ">=3.11"
dependencies = [
  "coach-i18n==0.1.0",
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "langgraph>=0.2",
  "openai>=2.54,<3",
  "boto3>=1.35",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27",
  "pytest>=8.2",
  "ruff==0.16.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["app*", "prompts*"]

[tool.setuptools.package-data]
"app.core" = ["model-role-policy.json"]
"prompts.current" = ["*.json"]

[tool.ruff]
line-length = 100
