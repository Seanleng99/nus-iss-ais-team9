[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "coach-i18n"
version = "0.1.0"
description = "Shared language selection and reviewed translations for Coach services"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
include = ["coach_i18n*"]

[tool.setuptools.package-data]
coach_i18n = ["locales/*.json", "data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
