name: Release to AWS

on:
  # CI enforces offline gates; release requires live acceptance before completion.
  # Only a successful CI push for the tested current main SHA can release.
  workflow_run:
    workflows: [CI and LLMSecOps]
    branches: [main]
    types: [completed]

concurrency:
  group: deploy-demo
  cancel-in-progress: false

permissions:
  contents: read

env:
  RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
  RELEASE_SOURCE_EVENT: ${{ github.event.workflow_run.event }}
  RELEASE_SOURCE_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
  AWS_REGION: ${{ vars.AWS_REGION || 'ap-southeast-1' }}

jobs:
  release-gate:
    name: Verify successful current main CI
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      deploy: ${{ steps.current.outputs.deploy }}
      frontend: ${{ steps.current.outputs.frontend }}
      backend: ${{ steps.current.outputs.backend }}
      ai: ${{ steps.current.outputs.ai }}
      migrations: ${{ steps.current.outputs.migrations }}
    steps:
      - id: current
        name: Load change manifest and reject stale runs
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          main_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [[ "$RELEASE_SHA" != "$main_sha" ]]; then
            echo "Skipping stale SHA $RELEASE_SHA; current main is $main_sha."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          mkdir -p artifacts
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name change-manifest --dir artifacts
          manifest=artifacts/change-manifest.json
          for output in frontend backend ai migrations; do
            case "$output" in
              frontend) key=frontend_deploy ;;
              backend) key=backend_deploy ;;
              ai) key=ai_deploy ;;
              migrations) key=migrations ;;
            esac
            value=$(jq -r ".$key" "$manifest")
            if [[ "$value" != "true" && "$value" != "false" ]]; then
              echo "Invalid $key value in change manifest: $value" >&2
              exit 1
            fi
            printf -v "$output" '%s' "$value"
          done
          deploy=$(jq -r '.deploy' "$manifest")
          if [[ "$deploy" != "true" && "$deploy" != "false" ]]; then
            echo "Invalid deploy value in change manifest: $deploy" >&2
            exit 1
          fi
          if [[ "$migrations" == "true" && "$backend" != "true" ]]; then
            echo "Migration selection requires a backend deployment." >&2
            exit 1
          fi
          if [[ "$ai" == "true" && "$backend" != "true" ]]; then
            echo "AI deployment requires a compatible backend deployment." >&2
            exit 1
          fi
          expected_deploy=false
          if [[ "$frontend" == "true" || "$backend" == "true" || "$ai" == "true" ]]; then
            expected_deploy=true
          fi
          if [[ "$deploy" != "$expected_deploy" ]]; then
            echo "Deploy flag does not match selected services." >&2
            exit 1
          fi
          # A previous release may have rolled back every service. A push diff
          # cannot prove that unchanged services already contain earlier fixes.
          # Publish a coherent release from the tested SHA so recovery cannot
          # leave an unchanged frontend or backend on a vulnerable old image.
          if [[ "$deploy" == "true" ]]; then
            frontend=true
            backend=true
            ai=true
            migrations=true
          fi
          for output in frontend backend ai migrations; do
            echo "$output=${!output}" >> "$GITHUB_OUTPUT"
          done
          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"
          echo "Release selection for $RELEASE_SHA: $(jq -c . "$manifest")"

  build-images:
    name: Build, publish, and scan images
    needs: [release-gate, live-preflight]
    if: needs.release-gate.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    outputs:
      ai-image: ${{ steps.images.outputs.ai-image }}
      backend-image: ${{ steps.images.outputs.backend-image }}
      frontend-image: ${{ steps.images.outputs.frontend-image }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_SHA }}
          persist-credentials: false
      - name: Validate publishing configuration
        env:
          PUBLISH_ROLE: ${{ vars.AWS_PUBLISH_ROLE_ARN }}
          AI_CHANGED: ${{ needs.release-gate.outputs.ai }}
          BACKEND_CHANGED: ${{ needs.release-gate.outputs.backend }}
          FRONTEND_CHANGED: ${{ needs.release-gate.outputs.frontend }}
          AI_REPOSITORY: ${{ vars.ECR_AI_REPOSITORY }}
          BACKEND_REPOSITORY: ${{ vars.ECR_BACKEND_REPOSITORY }}
          FRONTEND_REPOSITORY: ${{ vars.ECR_FRONTEND_REPOSITORY }}
        run: |
          [[ -n "$PUBLISH_ROLE" ]] || { echo "Missing PUBLISH_ROLE" >&2; exit 1; }
          [[ "$AI_CHANGED" != "true" || -n "$AI_REPOSITORY" ]] || \
            { echo "Missing AI_REPOSITORY" >&2; exit 1; }
          [[ "$BACKEND_CHANGED" != "true" || -n "$BACKEND_REPOSITORY" ]] || \
            { echo "Missing BACKEND_REPOSITORY" >&2; exit 1; }
          [[ "$FRONTEND_CHANGED" != "true" || -n "$FRONTEND_REPOSITORY" ]] || \
            { echo "Missing FRONTEND_REPOSITORY" >&2; exit 1; }
      - name: Report non-secret OIDC claims
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          import urllib.request

          url = f"{os.environ['ACTIONS_ID_TOKEN_REQUEST_URL']}&audience=sts.amazonaws.com"
          request = urllib.request.Request(
              url,
              headers={
                  "Authorization": f"bearer {os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN']}"
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              token = json.load(response)["value"]
          encoded_payload = token.split(".")[1]
          encoded_payload += "=" * (-len(encoded_payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(encoded_payload))
          safe_claims = {
              name: claims.get(name)
              for name in (
                  "iss",
                  "aud",
                  "sub",
                  "repository",
                  "repository_id",
                  "repository_owner",
                  "repository_owner_id",
                  "ref",
                  "environment",
              )
              if claims.get(name) is not None
          }
          print(json.dumps(safe_claims, sort_keys=True))
          PY
      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_PUBLISH_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push immutable images
        id: images
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          AI_CHANGED: ${{ needs.release-gate.outputs.ai }}
          BACKEND_CHANGED: ${{ needs.release-gate.outputs.backend }}
          FRONTEND_CHANGED: ${{ needs.release-gate.outputs.frontend }}
          AI_REPOSITORY: ${{ vars.ECR_AI_REPOSITORY }}
          BACKEND_REPOSITORY: ${{ vars.ECR_BACKEND_REPOSITORY }}
          FRONTEND_REPOSITORY: ${{ vars.ECR_FRONTEND_REPOSITORY }}
        run: |
          publish_image() {
            local repository="$1" dockerfile="$2" output_name="$3"
            local image="$ECR_REGISTRY/$repository:$RELEASE_SHA"
            if aws ecr describe-images --repository-name "$repository" \
              --image-ids "imageTag=$RELEASE_SHA" >/dev/null 2>&1; then
              echo "Reusing existing immutable image: $image"
            else
              docker build --label "org.opencontainers.image.revision=$RELEASE_SHA" \
                -f "$dockerfile" -t "$image" .
              docker push "$image"
            fi
            echo "$output_name=$image" >> "$GITHUB_OUTPUT"
          }
          if [[ "$AI_CHANGED" == "true" ]]; then
            publish_image "$AI_REPOSITORY" infra/docker/Dockerfile.ai-service ai-image
          fi
          if [[ "$BACKEND_CHANGED" == "true" ]]; then
            publish_image "$BACKEND_REPOSITORY" infra/docker/Dockerfile.backend backend-image
          fi
          if [[ "$FRONTEND_CHANGED" == "true" ]]; then
            publish_image "$FRONTEND_REPOSITORY" infra/docker/Dockerfile.frontend frontend-image
          fi
      - name: Gate on Amazon ECR and Inspector findings
        env:
          AI_CHANGED: ${{ needs.release-gate.outputs.ai }}
          BACKEND_CHANGED: ${{ needs.release-gate.outputs.backend }}
          FRONTEND_CHANGED: ${{ needs.release-gate.outputs.frontend }}
          AI_REPOSITORY: ${{ vars.ECR_AI_REPOSITORY }}
          BACKEND_REPOSITORY: ${{ vars.ECR_BACKEND_REPOSITORY }}
          FRONTEND_REPOSITORY: ${{ vars.ECR_FRONTEND_REPOSITORY }}
        run: |
          if [[ "$AI_CHANGED" == "true" ]]; then
            python infra/scripts/ecr_scan_gate.py \
              --repository "$AI_REPOSITORY" --image-tag "$RELEASE_SHA"
          fi
          if [[ "$BACKEND_CHANGED" == "true" ]]; then
            python infra/scripts/ecr_scan_gate.py \
              --repository "$BACKEND_REPOSITORY" --image-tag "$RELEASE_SHA"
          fi
          if [[ "$FRONTEND_CHANGED" == "true" ]]; then
            python infra/scripts/ecr_scan_gate.py \
              --repository "$FRONTEND_REPOSITORY" --image-tag "$RELEASE_SHA"
          fi

  live-preflight:
    name: Validate live configuration and secret access
    needs:
      - release-gate
    if: needs.release-gate.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: demo
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_SOURCE_EVENT: ${{ github.event.workflow_run.event }}
      RELEASE_SOURCE_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
      COACH_SMOKE_URL: ${{ vars.COACH_SMOKE_URL }}
      SMOKE_BACKEND_API_KEY: ${{ secrets.SMOKE_BACKEND_API_KEY }}
      LIVE_MODEL_INPUT_USD_PER_MILLION: ${{ vars.LIVE_MODEL_INPUT_USD_PER_MILLION }}
      LIVE_MODEL_OUTPUT_USD_PER_MILLION: ${{ vars.LIVE_MODEL_OUTPUT_USD_PER_MILLION }}
      FAIRNESS_LIVE_MAX_COST_USD: ${{ vars.FAIRNESS_LIVE_MAX_COST_USD || '1' }}
      SECURITY_TEST_ROLE: ${{ vars.AWS_INVESTMENT_TEST_ROLE_ARN }}
      INVESTMENT_TEST_OPENAI_SECRET_ID: ${{ vars.INVESTMENT_TEST_OPENAI_SECRET_ID }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_SHA }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install release acceptance dependencies
        run: python -m pip install -e "apps/shared" -e "apps/ai-service"
      - name: Validate required live acceptance configuration
        run: python -m infra.scripts.post_deploy_acceptance --mode validate-config
      - name: Preflight isolated live security credentials
        id: security-preflight-credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.SECURITY_TEST_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
          output-credentials: true
          output-env-credentials: false
          mask-aws-account-id: true
      - name: Verify live security secret access before deployment
        env:
          AWS_ACCESS_KEY_ID: ${{ steps.security-preflight-credentials.outputs.aws-access-key-id }}
          AWS_SECRET_ACCESS_KEY: ${{ steps.security-preflight-credentials.outputs.aws-secret-access-key }}
          AWS_SESSION_TOKEN: ${{ steps.security-preflight-credentials.outputs.aws-session-token }}
        run: python -c "from security.promptfoo.model_support import live_settings; live_settings()"

  corpus:
    name: Verify governed Bedrock corpora
    needs:
      - release-gate
      - build-images
    if: needs.release-gate.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: demo
    permissions:
      contents: read
      id-token: write
    env:
      EDUCATION_KNOWLEDGE_BASE_ID: ${{ vars.EDUCATION_KNOWLEDGE_BASE_ID }}
      POLICY_KNOWLEDGE_BASE_ID: ${{ vars.POLICY_KNOWLEDGE_BASE_ID }}
      AI_CHANGED: ${{ needs.release-gate.outputs.ai }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_SHA }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify release is still current main
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          main_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [[ "$RELEASE_SHA" != "$main_sha" ]]; then
            echo "Superseded release $RELEASE_SHA skipped; current main is $main_sha." >> "$GITHUB_STEP_SUMMARY"
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "deploy=true" >> "$GITHUB_OUTPUT"
      - name: Install release acceptance dependencies
        run: python -m pip install -e "apps/shared" -e "apps/ai-service"
        if: steps.current.outputs.deploy == 'true'
      - name: Validate first-attempt release context
        if: steps.current.outputs.deploy == 'true'
        run: python -m infra.scripts.post_deploy_acceptance --mode validate-context
      - name: Load packaged corpus versions
        run: |
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          versions = {}
          for name, directory in (
              ("EDUCATION_CORPUS_VERSION", "investment_education"),
              ("POLICY_CORPUS_VERSION", "policy_controls"),
          ):
              manifest = Path("knowledge") / directory / "source_manifest.json"
              version = json.loads(manifest.read_text())["corpus_version"]
              if (
                  not isinstance(version, str)
                  or not re.fullmatch(r"[a-z0-9][a-z0-9@._-]{2,127}", version)
                  or version.endswith("@local-fixture-v1")
              ):
                  raise SystemExit(f"Invalid deployed corpus version in {manifest}")
              versions[name] = version
          with open(os.environ["GITHUB_ENV"], "a") as output:
              for name, version in versions.items():
                  output.write(f"{name}={version}\n")
          PY
        if: steps.current.outputs.deploy == 'true'
      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true
        if: steps.current.outputs.deploy == 'true'
      - name: Ingest and verify approved Bedrock corpora
        run: |
          python infra/scripts/sync_bedrock_corpora.py \
            --education-kb "$EDUCATION_KNOWLEDGE_BASE_ID" \
            --policy-kb "$POLICY_KNOWLEDGE_BASE_ID" \
            --region "$AWS_REGION"
        if: steps.current.outputs.deploy == 'true'
      - name: Retain Bedrock ingestion and governance evidence
        uses: actions/upload-artifact@v7
        with:
          name: bedrock-corpus-governance-${{ github.run_id }}
          path: artifacts/bedrock-governance/
          if-no-files-found: warn
          retention-days: 90
        if: steps.current.outputs.deploy == 'true' && always()
    outputs:
      deploy: ${{ steps.current.outputs.deploy }}

  deploy-demo:
    name: Deploy demo environment
    needs:
      - release-gate
      - build-images
      - corpus
    if: needs.corpus.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: demo
      url: ${{ vars.FRONTEND_URL }}
    permissions:
      contents: read
      id-token: write
    env:
      AI_CHANGED: ${{ needs.release-gate.outputs.ai }}
      BACKEND_CHANGED: ${{ needs.release-gate.outputs.backend }}
      FRONTEND_CHANGED: ${{ needs.release-gate.outputs.frontend }}
      MIGRATIONS_CHANGED: ${{ needs.release-gate.outputs.migrations }}
      DEPLOY_ROLE: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
      ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
      AI_SERVICE: ${{ vars.ECS_AI_SERVICE }}
      BACKEND_SERVICE: ${{ vars.ECS_BACKEND_SERVICE }}
      FRONTEND_SERVICE: ${{ vars.ECS_FRONTEND_SERVICE }}
      AI_TASK_FAMILY: ${{ vars.ECS_AI_TASK_FAMILY }}
      BACKEND_TASK_FAMILY: ${{ vars.ECS_BACKEND_TASK_FAMILY }}
      FRONTEND_TASK_FAMILY: ${{ vars.ECS_FRONTEND_TASK_FAMILY }}
      AI_CONTAINER_NAME: ${{ vars.ECS_AI_CONTAINER_NAME }}
      BACKEND_CONTAINER_NAME: ${{ vars.ECS_BACKEND_CONTAINER_NAME }}
      FRONTEND_CONTAINER_NAME: ${{ vars.ECS_FRONTEND_CONTAINER_NAME }}
      FRONTEND_URL: ${{ vars.FRONTEND_URL }}
      FRONTEND_HEALTH_URL: ${{ vars.FRONTEND_HEALTH_URL }}
      BACKEND_HEALTH_URL: ${{ vars.BACKEND_HEALTH_URL }}
      COACH_SMOKE_URL: ${{ vars.COACH_SMOKE_URL }}
      SMOKE_BACKEND_API_KEY: ${{ secrets.SMOKE_BACKEND_API_KEY }}
      EDUCATION_KNOWLEDGE_BASE_ID: ${{ vars.EDUCATION_KNOWLEDGE_BASE_ID }}
      POLICY_KNOWLEDGE_BASE_ID: ${{ vars.POLICY_KNOWLEDGE_BASE_ID }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_SHA }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify release is still current main
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          main_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [[ "$RELEASE_SHA" != "$main_sha" ]]; then
            echo "Superseded release $RELEASE_SHA skipped; current main is $main_sha." >> "$GITHUB_STEP_SUMMARY"
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "deploy=true" >> "$GITHUB_OUTPUT"
      - name: Install release acceptance dependencies
        if: steps.current.outputs.deploy == 'true'
        run: python -m pip install -e "apps/shared" -e "apps/ai-service"
      - name: Validate first-attempt release context
        if: steps.current.outputs.deploy == 'true'
        run: python -m infra.scripts.post_deploy_acceptance --mode validate-context
      - name: Load packaged corpus versions
        if: steps.current.outputs.deploy == 'true'
        run: |
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          versions = {}
          for name, directory in (
              ("EDUCATION_CORPUS_VERSION", "investment_education"),
              ("POLICY_CORPUS_VERSION", "policy_controls"),
          ):
              manifest = Path("knowledge") / directory / "source_manifest.json"
              version = json.loads(manifest.read_text())["corpus_version"]
              if (
                  not isinstance(version, str)
                  or not re.fullmatch(r"[a-z0-9][a-z0-9@._-]{2,127}", version)
                  or version.endswith("@local-fixture-v1")
              ):
                  raise SystemExit(f"Invalid deployed corpus version in {manifest}")
              versions[name] = version
          with open(os.environ["GITHUB_ENV"], "a") as output:
              for name, version in versions.items():
                  output.write(f"{name}={version}\n")
          PY
      - name: Load AI role policy
        if: steps.current.outputs.deploy == 'true'
        run: |
          python infra/scripts/load_model_role_policy.py --github-env "$GITHUB_ENV"
      - name: Validate deployment configuration
        if: steps.current.outputs.deploy == 'true'
        run: |
          required=(
            DEPLOY_ROLE ECS_CLUSTER
            FRONTEND_URL FRONTEND_HEALTH_URL BACKEND_HEALTH_URL
            COACH_SMOKE_URL EDUCATION_CORPUS_VERSION POLICY_CORPUS_VERSION
            EDUCATION_KNOWLEDGE_BASE_ID POLICY_KNOWLEDGE_BASE_ID
            SMOKE_BACKEND_API_KEY
          )
          if [[ "$AI_CHANGED" == "true" ]]; then
            required+=(AI_SERVICE AI_TASK_FAMILY AI_CONTAINER_NAME)
          fi
          if [[ "$BACKEND_CHANGED" == "true" ]]; then
            required+=(BACKEND_SERVICE BACKEND_TASK_FAMILY BACKEND_CONTAINER_NAME)
          fi
          if [[ "$FRONTEND_CHANGED" == "true" ]]; then
            required+=(FRONTEND_SERVICE FRONTEND_TASK_FAMILY FRONTEND_CONTAINER_NAME)
          fi
          for name in "${required[@]}"; do
            if [[ -z "${!name}" ]]; then
              echo "Missing demo environment variable or secret: $name" >&2
              exit 1
            fi
          done
      - name: Configure short-lived AWS credentials
        if: steps.current.outputs.deploy == 'true'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true
      - name: Verify ECS rollback protection and capture current revisions
        if: steps.current.outputs.deploy == 'true'
        run: |
          services=()
          [[ "$AI_CHANGED" != "true" ]] || services+=("$AI_SERVICE")
          [[ "$BACKEND_CHANGED" != "true" ]] || services+=("$BACKEND_SERVICE")
          [[ "$FRONTEND_CHANGED" != "true" ]] || services+=("$FRONTEND_SERVICE")
          for service in "${services[@]}"; do
            enabled=$(aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$service" \
              --query 'services[0].deploymentConfiguration.deploymentCircuitBreaker.enable' \
              --output text)
            rollback=$(aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$service" \
              --query 'services[0].deploymentConfiguration.deploymentCircuitBreaker.rollback' \
              --output text)
            if [[ "$enabled" != "True" || "$rollback" != "True" ]]; then
              echo "ECS circuit breaker with rollback must be enabled for $service" >&2
              exit 1
            fi
          done

          if [[ "$AI_CHANGED" == "true" ]]; then
            previous=$(aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$AI_SERVICE" \
              --query 'services[0].taskDefinition' --output text)
            [[ "$previous" =~ ^arn:aws[a-z-]*:ecs:[a-z0-9-]+:[0-9]{12}:task-definition/.+:[0-9]+$ ]] || { echo "Invalid previous ECS task revision" >&2; exit 1; }
            echo "AI_PREVIOUS_TASK_DEFINITION=$previous" >> "$GITHUB_ENV"
            # Family/revision avoids GitHub dropping an ARN output containing the masked AWS account ID.
            echo "ai-previous-task-definition=${previous##*/}" >> "$GITHUB_OUTPUT"
          fi
          if [[ "$BACKEND_CHANGED" == "true" ]]; then
            previous=$(aws ecs describe-services --cluster "$ECS_CLUSTER" \
              --services "$BACKEND_SERVICE" --query 'services[0].taskDefinition' --output text)
            [[ "$previous" =~ ^arn:aws[a-z-]*:ecs:[a-z0-9-]+:[0-9]{12}:task-definition/.+:[0-9]+$ ]] || { echo "Invalid previous ECS task revision" >&2; exit 1; }
            echo "BACKEND_PREVIOUS_TASK_DEFINITION=$previous" >> "$GITHUB_ENV"
            echo "backend-previous-task-definition=${previous##*/}" >> "$GITHUB_OUTPUT"
          fi
          if [[ "$FRONTEND_CHANGED" == "true" ]]; then
            previous=$(aws ecs describe-services --cluster "$ECS_CLUSTER" \
              --services "$FRONTEND_SERVICE" --query 'services[0].taskDefinition' --output text)
            [[ "$previous" =~ ^arn:aws[a-z-]*:ecs:[a-z0-9-]+:[0-9]{12}:task-definition/.+:[0-9]+$ ]] || { echo "Invalid previous ECS task revision" >&2; exit 1; }
            echo "FRONTEND_PREVIOUS_TASK_DEFINITION=$previous" >> "$GITHUB_ENV"
            echo "frontend-previous-task-definition=${previous##*/}" >> "$GITHUB_OUTPUT"
          fi
        id: rollback-state
      - name: Download current task definitions
        if: steps.current.outputs.deploy == 'true'
        run: |
          if [[ "$AI_CHANGED" == "true" ]]; then
            aws ecs describe-task-definition --task-definition "$AI_TASK_FAMILY" \
              --query taskDefinition > ai-task-definition.json
          fi
          if [[ "$BACKEND_CHANGED" == "true" ]]; then
            aws ecs describe-task-definition --task-definition "$BACKEND_TASK_FAMILY" \
              --query taskDefinition > backend-task-definition.json
          fi
          if [[ "$FRONTEND_CHANGED" == "true" ]]; then
            aws ecs describe-task-definition --task-definition "$FRONTEND_TASK_FAMILY" \
              --query taskDefinition > frontend-task-definition.json
          fi
      - name: Render AI service task definition
        id: render-ai
        if: steps.current.outputs.deploy == 'true' && (needs.release-gate.outputs.ai == 'true')
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ai-task-definition.json
          container-name: ${{ env.AI_CONTAINER_NAME }}
          image: ${{ needs.build-images.outputs.ai-image }}
          environment-variables: |
            APP_ENV=demo
            MODEL_PROVIDER=openai
            MODEL_ID=gpt-6-luna
            MODEL_REASONING_EFFORT=medium
            MODEL_MAX_TOKENS=3200
            MODEL_ROLE_OVERRIDES=${{ env.MODEL_ROLE_OVERRIDES }}
            MAX_MODEL_TOKENS_PER_RUN=80000
            MODEL_READ_TIMEOUT_SECONDS=30
            AGENT_TIMEOUT_SECONDS=45
            WORKFLOW_TIMEOUT_SECONDS=85
            PROMPT_SET_VERSION=${{ env.PROMPT_SET_VERSION }}
            BUILD_COMMIT=${{ env.RELEASE_SHA }}
            RAG_PROVIDER=bedrock
            POLICY_RAG_PROVIDER=bedrock
            EDUCATION_KNOWLEDGE_BASE_ID=${{ env.EDUCATION_KNOWLEDGE_BASE_ID }}
            POLICY_KNOWLEDGE_BASE_ID=${{ env.POLICY_KNOWLEDGE_BASE_ID }}
            RAG_MINIMUM_SCORE=0.6
            POLICY_RAG_MINIMUM_SCORE=0.0
            EDUCATION_CORPUS_VERSION=${{ env.EDUCATION_CORPUS_VERSION }}
            POLICY_CORPUS_VERSION=${{ env.POLICY_CORPUS_VERSION }}
      - name: Verify AI runtime configuration has not drifted
        if: steps.current.outputs.deploy == 'true' && (needs.release-gate.outputs.ai == 'true')
        env:
          RENDERED_AI_TASK: ${{ steps.render-ai.outputs.task-definition }}
          MODEL_ROLE_OVERRIDES: ${{ env.MODEL_ROLE_OVERRIDES }}
        run: python infra/scripts/verify_ecs_task_config.py --task-definition "$RENDERED_AI_TASK" --container "$AI_CONTAINER_NAME" --expect APP_ENV=demo --expect MODEL_PROVIDER=openai --expect MODEL_ID=gpt-6-luna --expect MODEL_REASONING_EFFORT=medium --expect MODEL_MAX_TOKENS=3200 --expect "MODEL_ROLE_OVERRIDES=$MODEL_ROLE_OVERRIDES" --expect MAX_MODEL_TOKENS_PER_RUN=80000 --expect MODEL_READ_TIMEOUT_SECONDS=30 --expect AGENT_TIMEOUT_SECONDS=45 --expect WORKFLOW_TIMEOUT_SECONDS=85 --expect "PROMPT_SET_VERSION=$PROMPT_SET_VERSION" --expect "BUILD_COMMIT=$RELEASE_SHA" --expect RAG_PROVIDER=bedrock --expect POLICY_RAG_PROVIDER=bedrock --expect "EDUCATION_KNOWLEDGE_BASE_ID=$EDUCATION_KNOWLEDGE_BASE_ID" --expect "POLICY_KNOWLEDGE_BASE_ID=$POLICY_KNOWLEDGE_BASE_ID" --require-nonempty EDUCATION_KNOWLEDGE_BASE_ID --require-nonempty POLICY_KNOWLEDGE_BASE_ID --expect RAG_MINIMUM_SCORE=0.6 --expect POLICY_RAG_MINIMUM_SCORE=0.0 --expect "EDUCATION_CORPUS_VERSION=$EDUCATION_CORPUS_VERSION" --expect "POLICY_CORPUS_VERSION=$POLICY_CORPUS_VERSION"
          --require-secret OPENAI_API_KEY
      - name: Record ai deployment attempt
        if: steps.current.outputs.deploy == 'true' && (needs.release-gate.outputs.ai == 'true')
        run: |
          echo "AI_DEPLOYED=true" >> "$GITHUB_ENV"
          echo "attempted=true" >> "$GITHUB_OUTPUT"
        id: attempt-ai
      - name: Deploy AI service
        if: steps.current.outputs.deploy == 'true' && (needs.release-gate.outputs.ai == 'true')
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-ai.outputs.task-definition }}
          cluster: ${{ env.ECS_CLUSTER }}
          service: ${{ env.AI_SERVICE }}
          wait-for-service-stability: true
          enable-ecs-managed-tags: true
          propagate-tags: SERVICE
      - name: Render application backend task definition
        id: render-backend
        if: steps.current.outputs.deploy == 'true' && (needs.release-gate.outputs.backend == 'true')
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: backend-task-definition.json
          container-name: ${{ env.BACKEND_CONTAINER_NAME }}
          image: ${{ needs.build-images.outputs.backend-image }}
          environment-variables: |
            AI_SERVICE_TIMEOUT_SECONDS=90
            TRACE_RETENTION_DAYS=30
            CHAT_RETENTION_DAYS=90
            SYNTHETIC_USER_RETENTION_DAYS=30
            DURABLE_AGENT_MEMORY_ENABLED=false
      - name: Verify backend data-lifecycle configuration has not drifted
        if: steps.current.outputs.deploy == 'true' && (needs.release-gate.outputs.backend == 'true')
        env:
          RENDERED_BACKEND_TASK: ${{ steps.render-backend.outputs.task-definition }}
        run: python infra/scripts/verify_ecs_task_config.py --task-definition "$RENDERED_BACKEND_TASK" --container "$BACKEND_CONTAINER_NAME" --expect AI_SERVICE_TIMEOUT_SECONDS=90 --expect TRACE_RETENTION_DAYS=30 --expect CHAT_RETENTION_DAYS=90 --expect SYNTHETIC_USER_RETENTION_DAYS=30 --expect DURABLE_AGENT_MEMORY_ENABLED=false
      - name: Apply and verify database migrations as a one-shot task
        if: steps.current.outputs.deploy == 'true' && (needs.release-gate.outputs.backend == 'true')
        env:
          RENDERED_BACKEND_TASK: ${{ steps.render-backend.outputs.task-definition }}
        run: |
          network_configuration=$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" --services "$BACKEND_SERVICE" \
            --query 'services[0].networkConfiguration' --output json)
          migration_task_definition=$(aws ecs register-task-definition \
            --cli-input-json "file://$RENDERED_BACKEND_TASK" \
            --query 'taskDefinition.taskDefinitionArn' --output text)
          overrides=$(jq -nc --arg name "$BACKEND_CONTAINER_NAME" \
            '{containerOverrides:[{name:$name,command:["alembic","upgrade","head"]}]}')
          run_result=$(aws ecs run-task \
            --cluster "$ECS_CLUSTER" \
            --task-definition "$migration_task_definition" \
            --launch-type FARGATE \
            --network-configuration "$network_configuration" \
            --overrides "$overrides")
          if [[ $(jq '.failures | length' <<< "$run_result") -ne 0 ]]; then
            jq '.failures' <<< "$run_result" >&2
            exit 1
          fi
          migration_task=$(jq -r '.tasks[0].taskArn' <<< "$run_result")
          aws ecs wait tasks-stopped --cluster "$ECS_CLUSTER" --tasks "$migration_task"
          exit_code=$(aws ecs describe-tasks \
            --cluster "$ECS_CLUSTER" --tasks "$migration_task" \
            --query "tasks[0].containers[?name=='$BACKEND_CONTAINER_NAME'].exitCode | [0]" \
            --output text)
          if [[ "$exit_code" != "0" ]]; then
            aws ecs describe-tasks --cluster "$ECS_CLUSTER" --tasks "$migration_task" \
              --query 'tasks[0].{stoppedReason:stoppedReason,containers:containers[*].{name:name,reason:reason,exitCode:exitCode}}'
            exit 1
          fi
      - name: Record backend deployment attempt
        if: steps.current.outputs.deploy == 'true' && (needs.release-gate.outputs.backend == 'true')
        run: |
          echo "BACKEND_DEPLOYED=true" >> "$GITHUB_ENV"
          echo "attempted=true" >> "$GITHUB_OUTPUT"
        id: attempt-backend
      - name: Deploy application backend
        if: steps.current.outputs.deploy == 'true' && (needs.release-gate.outputs.backend == 'true')
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-backend.outputs.task-definition }}
          cluster: ${{ env.ECS_CLUSTER }}
          service: ${{ env.BACKEND_SERVICE }}
          wait-for-service-stability: true
          enable-ecs-managed-tags: true
          propagate-tags: SERVICE
      - name: Render Streamlit task definition
        id: render-frontend
        if: steps.current.outputs.deploy == 'true' && (needs.release-gate.outputs.frontend == 'true')
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: frontend-task-definition.json
          container-name: ${{ env.FRONTEND_CONTAINER_NAME }}
          image: ${{ needs.build-images.outputs.frontend-image }}
      - name: Record frontend deployment attempt
        if: steps.current.outputs.deploy == 'true' && (needs.release-gate.outputs.frontend == 'true')
        run: |
          echo "FRONTEND_DEPLOYED=true" >> "$GITHUB_ENV"
          echo "attempted=true" >> "$GITHUB_OUTPUT"
        id: attempt-frontend
      - name: Deploy Streamlit frontend
        if: steps.current.outputs.deploy == 'true' && (needs.release-gate.outputs.frontend == 'true')
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-frontend.outputs.task-definition }}
          cluster: ${{ env.ECS_CLUSTER }}
          service: ${{ env.FRONTEND_SERVICE }}
          wait-for-service-stability: true
          enable-ecs-managed-tags: true
          propagate-tags: SERVICE
    outputs:
      deploy: ${{ steps.current.outputs.deploy }}
      ai-previous-task-definition: ${{ steps.rollback-state.outputs.ai-previous-task-definition }}
      ai-attempted: ${{ steps.attempt-ai.outputs.attempted }}
      backend-previous-task-definition: ${{ steps.rollback-state.outputs.backend-previous-task-definition }}
      backend-attempted: ${{ steps.attempt-backend.outputs.attempted }}
      frontend-previous-task-definition: ${{ steps.rollback-state.outputs.frontend-previous-task-definition }}
      frontend-attempted: ${{ steps.attempt-frontend.outputs.attempted }}

  smoke:
    name: Health and AI safety smoke
    needs:
      - deploy-demo
    if: needs.deploy-demo.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: demo
    permissions:
      contents: read
    env:
      COACH_SMOKE_URL: ${{ vars.COACH_SMOKE_URL }}
      SMOKE_BACKEND_API_KEY: ${{ secrets.SMOKE_BACKEND_API_KEY }}
      FRONTEND_HEALTH_URL: ${{ vars.FRONTEND_HEALTH_URL }}
      BACKEND_HEALTH_URL: ${{ vars.BACKEND_HEALTH_URL }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_SHA }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install release acceptance dependencies
        run: python -m pip install -e "apps/shared" -e "apps/ai-service"
      - name: Validate first-attempt release context
        run: python -m infra.scripts.post_deploy_acceptance --mode validate-context
      - name: Load packaged corpus versions
        run: |
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          versions = {}
          for name, directory in (
              ("EDUCATION_CORPUS_VERSION", "investment_education"),
              ("POLICY_CORPUS_VERSION", "policy_controls"),
          ):
              manifest = Path("knowledge") / directory / "source_manifest.json"
              version = json.loads(manifest.read_text())["corpus_version"]
              if (
                  not isinstance(version, str)
                  or not re.fullmatch(r"[a-z0-9][a-z0-9@._-]{2,127}", version)
                  or version.endswith("@local-fixture-v1")
              ):
                  raise SystemExit(f"Invalid deployed corpus version in {manifest}")
              versions[name] = version
          with open(os.environ["GITHUB_ENV"], "a") as output:
              for name, version in versions.items():
                  output.write(f"{name}={version}\n")
          PY
      - name: Run health and AI safety smoke tests
        run: python infra/scripts/post_deploy_smoke.py --frontend-health-url "$FRONTEND_HEALTH_URL" --backend-health-url "$BACKEND_HEALTH_URL" --coach-url "$COACH_SMOKE_URL" --expected-model-provider openai --expected-corpus-version "$EDUCATION_CORPUS_VERSION" --expected-policy-corpus-version "$POLICY_CORPUS_VERSION" --persistence-base-url "${COACH_SMOKE_URL%/coach}" --api-key "$SMOKE_BACKEND_API_KEY"

  security-live:
    name: Promptfoo — required live security
    needs:
      - deploy-demo
      - smoke
    if: needs.deploy-demo.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    environment:
      name: demo
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_SOURCE_EVENT: ${{ github.event.workflow_run.event }}
      RELEASE_SOURCE_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
      SECURITY_TEST_ROLE: ${{ vars.AWS_INVESTMENT_TEST_ROLE_ARN }}
      INVESTMENT_TEST_OPENAI_SECRET_ID: ${{ vars.INVESTMENT_TEST_OPENAI_SECRET_ID }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_SHA }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install release acceptance dependencies
        run: python -m pip install -e "apps/shared" -e "apps/ai-service"
      - name: Validate first-attempt release context
        run: python -m infra.scripts.post_deploy_acceptance --mode validate-context
      - name: Prepare live security runtime
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Obtain isolated live security credentials
        id: security-credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.SECURITY_TEST_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
          output-credentials: true
          output-env-credentials: false
          mask-aws-account-id: true
      - name: Promptfoo — required live security regressions
        id: security-live
        timeout-minutes: 45
        env:
          AWS_ACCESS_KEY_ID: ${{ steps.security-credentials.outputs.aws-access-key-id }}
          AWS_SECRET_ACCESS_KEY: ${{ steps.security-credentials.outputs.aws-secret-access-key }}
          AWS_SESSION_TOKEN: ${{ steps.security-credentials.outputs.aws-session-token }}
        run: |
          python security/promptfoo/run_bounded.py \
            --mode live \
            --repeats 2 \
            --max-model-tokens 1000000 \
            --output artifacts/post-deploy/promptfoo-live.json
      - name: Publish live security evidence
        run: python infra/scripts/summarize_promptfoo.py artifacts/post-deploy/promptfoo-live.json --output artifacts/post-deploy/promptfoo-live-summary.md --title "Required release live security — real model, release source"
        if: always()
      - name: Retain live security evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-security-${{ github.run_id }}
          path: artifacts/post-deploy/
          if-no-files-found: error
          retention-days: 90

  fairness:
    name: Live fairness testing
    needs:
      - deploy-demo
      - security-live
    if: needs.deploy-demo.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    environment:
      name: demo
    permissions:
      contents: read
    env:
      RELEASE_SOURCE_EVENT: ${{ github.event.workflow_run.event }}
      RELEASE_SOURCE_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
      COACH_SMOKE_URL: ${{ vars.COACH_SMOKE_URL }}
      SMOKE_BACKEND_API_KEY: ${{ secrets.SMOKE_BACKEND_API_KEY }}
      LIVE_MODEL_INPUT_USD_PER_MILLION: ${{ vars.LIVE_MODEL_INPUT_USD_PER_MILLION }}
      LIVE_MODEL_OUTPUT_USD_PER_MILLION: ${{ vars.LIVE_MODEL_OUTPUT_USD_PER_MILLION }}
      FAIRNESS_LIVE_MAX_COST_USD: ${{ vars.FAIRNESS_LIVE_MAX_COST_USD || '1' }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_SHA }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install release acceptance dependencies
        run: python -m pip install -e "apps/shared" -e "apps/ai-service"
      - name: Validate first-attempt release context
        run: python -m infra.scripts.post_deploy_acceptance --mode validate-context
      - name: Live fairness testing
        id: fairness-live
        timeout-minutes: 45
        run: |
          python -m infra.scripts.fairness_live_evaluation \
            --url "$COACH_SMOKE_URL" \
            --api-key-env SMOKE_BACKEND_API_KEY \
            --expected-model-provider openai \
            --expected-model-id gpt-6-luna \
            --commit-sha "$RELEASE_SHA" \
            --repeats 1 \
            --timeout-seconds 120 \
            --input-cost-per-million "$LIVE_MODEL_INPUT_USD_PER_MILLION" \
            --output-cost-per-million "$LIVE_MODEL_OUTPUT_USD_PER_MILLION" \
            --maximum-estimated-cost-usd "$FAIRNESS_LIVE_MAX_COST_USD" \
            --maximum-total-tokens 1000000 \
            --output artifacts/post-deploy/fairness.json \
            --review-output artifacts/post-deploy/fairness-human-review.csv
      - name: Retain fairness evidence and blinded review
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-fairness-${{ github.run_id }}
          path: artifacts/post-deploy/
          if-no-files-found: error
          retention-days: 90

  live:
    name: 'Live: ${{ matrix.suite }}'
    needs:
      - deploy-demo
      - fairness
    if: needs.deploy-demo.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    environment:
      name: demo
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_SOURCE_EVENT: ${{ github.event.workflow_run.event }}
      RELEASE_SOURCE_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
      COACH_SMOKE_URL: ${{ vars.COACH_SMOKE_URL }}
      SMOKE_BACKEND_API_KEY: ${{ secrets.SMOKE_BACKEND_API_KEY }}
      ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
      AI_SERVICE: ${{ vars.ECS_AI_SERVICE }}
      BACKEND_SERVICE: ${{ vars.ECS_BACKEND_SERVICE }}
      FRONTEND_SERVICE: ${{ vars.ECS_FRONTEND_SERVICE }}
      COACH_URL: ${{ vars.COACH_SMOKE_URL }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_SHA }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install release acceptance dependencies
        run: python -m pip install -e "apps/shared" -e "apps/ai-service"
      - name: Initialize required suite evidence
        run: python -m infra.scripts.agent_live_evaluation --suite "${{ matrix.suite }}" --initialize
      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true
      - name: Live agent and RAG release contracts
        id: agents-live
        timeout-minutes: 45
        run: python -m infra.scripts.agent_live_evaluation --suite "${{ matrix.suite }}" --post-deployment
      - name: Publish live suite evidence
        if: always()
        run: python -m infra.scripts.agent_live_evaluation --suite "${{ matrix.suite }}" --summarize
      - name: Retain live suite evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-agent-live-${{ matrix.suite }}
          path: artifacts/agent-live/
          if-no-files-found: error
          retention-days: 90
    strategy:
      # Stop queued paid suites on failure; the final gate rejects missing evidence.
      fail-fast: true
      max-parallel: 1
      matrix:
        suite:
          - orchestrator
          - spending
          - budget
          - goal
          - investment
          - risk-compliance
          - rag

  live-acceptance:
    name: Require complete live release acceptance
    needs:
      - release-gate
      - live-preflight
      - build-images
      - corpus
      - deploy-demo
      - smoke
      - fairness
      - live
      - security-live
    # Pre-deployment failures are reported; deliberate stale/no-op releases are skipped.
    if: always() && needs.release-gate.outputs.deploy == 'true' && needs.corpus.outputs.deploy != 'false' && needs.deploy-demo.outputs.deploy != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: demo
    permissions:
      contents: read
    env:
      RELEASE_JOB_RESULTS: ${{ toJSON(needs) }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_SHA }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install release acceptance dependencies
        run: python -m pip install -e "apps/shared" -e "apps/ai-service"
      - name: Initialize required live evidence
        run: python -m infra.scripts.post_deploy_acceptance --mode initialize
      - name: Collect agent/RAG evidence
        if: always()
        uses: actions/download-artifact@v8
        with:
          pattern: release-agent-live-*
          path: artifacts/agent-live/
          merge-multiple: true
      - name: Collect fairness evidence
        if: always()
        uses: actions/download-artifact@v8
        with:
          name: release-fairness-${{ github.run_id }}
          path: artifacts/post-deploy/
      - name: Collect security evidence
        if: always()
        uses: actions/download-artifact@v8
        with:
          name: release-security-${{ github.run_id }}
          path: artifacts/post-deploy/
      - name: Require complete live release acceptance
        id: live-acceptance
        run: python -m infra.scripts.post_deploy_acceptance --mode gate
        if: always()
      - name: Retain live release acceptance and review forms
        uses: actions/upload-artifact@v7
        with:
          name: release-live-acceptance-${{ github.run_id }}
          path: |
            artifacts/post-deploy/
            artifacts/agent-live/
            infra/llmsecops/agent-live-evaluation-specs.json
            infra/llmsecops/agent-live-evaluation-cases.jsonl
            infra/llmsecops/investment-live-*.jsonl
            apps/ai-service/app/evals/datasets/fairness_consistency.jsonl
            security/promptfoo/cases.json
            security/promptfoo/assertions.cjs
          if-no-files-found: error
          retention-days: 90
        if: always()

  rollback:
    name: Roll back failed release
    needs:
      - deploy-demo
      - live-acceptance
    # Runs after failed/cancelled prerequisites and also covers partial ECS updates.
    if: always() && needs.deploy-demo.outputs.deploy == 'true' && (needs.deploy-demo.outputs.ai-attempted == 'true' || needs.deploy-demo.outputs.backend-attempted == 'true' || needs.deploy-demo.outputs.frontend-attempted == 'true') && (needs.deploy-demo.result != 'success' || needs.live-acceptance.result != 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: demo
    permissions:
      contents: read
      id-token: write
    env:
      DEPLOY_ROLE: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
      ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
      AI_SERVICE: ${{ vars.ECS_AI_SERVICE }}
      BACKEND_SERVICE: ${{ vars.ECS_BACKEND_SERVICE }}
      FRONTEND_SERVICE: ${{ vars.ECS_FRONTEND_SERVICE }}
      AI_DEPLOYED: ${{ needs.deploy-demo.outputs.ai-attempted }}
      BACKEND_DEPLOYED: ${{ needs.deploy-demo.outputs.backend-attempted }}
      FRONTEND_DEPLOYED: ${{ needs.deploy-demo.outputs.frontend-attempted }}
      AI_PREVIOUS_TASK_DEFINITION: ${{ needs.deploy-demo.outputs.ai-previous-task-definition }}
      BACKEND_PREVIOUS_TASK_DEFINITION: ${{ needs.deploy-demo.outputs.backend-previous-task-definition }}
      FRONTEND_PREVIOUS_TASK_DEFINITION: ${{ needs.deploy-demo.outputs.frontend-previous-task-definition }}
    steps:
      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true
      - name: Roll back services when post-deploy checks fail
        run: |
          services=()
          if [[ "$AI_DEPLOYED" == "true" ]]; then
            aws ecs update-service --cluster "$ECS_CLUSTER" --service "$AI_SERVICE" \
              --task-definition "$AI_PREVIOUS_TASK_DEFINITION"
            services+=("$AI_SERVICE")
          fi
          if [[ "$BACKEND_DEPLOYED" == "true" ]]; then
            aws ecs update-service --cluster "$ECS_CLUSTER" --service "$BACKEND_SERVICE" \
              --task-definition "$BACKEND_PREVIOUS_TASK_DEFINITION"
            services+=("$BACKEND_SERVICE")
          fi
          if [[ "$FRONTEND_DEPLOYED" == "true" ]]; then
            aws ecs update-service --cluster "$ECS_CLUSTER" --service "$FRONTEND_SERVICE" \
              --task-definition "$FRONTEND_PREVIOUS_TASK_DEFINITION"
            services+=("$FRONTEND_SERVICE")
          fi
          aws ecs wait services-stable --cluster "$ECS_CLUSTER" --services "${services[@]}"
