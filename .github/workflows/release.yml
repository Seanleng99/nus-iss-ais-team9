name: Release to AWS

on:
  workflow_run:
    workflows: [CI and LLMSecOps]
    branches: [main]
    types: [completed]

concurrency:
  group: deploy-demo
  cancel-in-progress: false

permissions:
  contents: read

env:
  RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
  AWS_REGION: ${{ vars.AWS_REGION || 'ap-southeast-1' }}

jobs:
  release-gate:
    name: Verify successful current main CI
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      deploy: ${{ steps.current.outputs.deploy }}
      frontend: ${{ steps.current.outputs.frontend }}
      backend: ${{ steps.current.outputs.backend }}
      ai: ${{ steps.current.outputs.ai }}
      migrations: ${{ steps.current.outputs.migrations }}
    steps:
      - id: current
        name: Load change manifest and reject stale runs
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          main_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [[ "$RELEASE_SHA" != "$main_sha" ]]; then
            echo "Skipping stale SHA $RELEASE_SHA; current main is $main_sha."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          mkdir -p artifacts
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name change-manifest --dir artifacts
          manifest=artifacts/change-manifest.json
          for output in frontend backend ai migrations; do
            case "$output" in
              frontend) key=frontend_deploy ;;
              backend) key=backend_deploy ;;
              ai) key=ai_deploy ;;
              migrations) key=migrations ;;
            esac
            value=$(jq -r ".$key" "$manifest")
            if [[ "$value" != "true" && "$value" != "false" ]]; then
              echo "Invalid $key value in change manifest: $value" >&2
              exit 1
            fi
            printf -v "$output" '%s' "$value"
          done
          deploy=$(jq -r '.deploy' "$manifest")
          if [[ "$deploy" != "true" && "$deploy" != "false" ]]; then
            echo "Invalid deploy value in change manifest: $deploy" >&2
            exit 1
          fi
          if [[ "$migrations" == "true" && "$backend" != "true" ]]; then
            echo "Migration selection requires a backend deployment." >&2
            exit 1
          fi
          if [[ "$ai" == "true" && "$backend" != "true" ]]; then
            echo "AI deployment requires a compatible backend deployment." >&2
            exit 1
          fi
          expected_deploy=false
          if [[ "$frontend" == "true" || "$backend" == "true" || "$ai" == "true" ]]; then
            expected_deploy=true
          fi
          if [[ "$deploy" != "$expected_deploy" ]]; then
            echo "Deploy flag does not match selected services." >&2
            exit 1
          fi
          # A previous release may have rolled back every service. A push diff
          # cannot prove that unchanged services already contain earlier fixes.
          # Publish a coherent release from the tested SHA so recovery cannot
          # leave an unchanged frontend or backend on a vulnerable old image.
          if [[ "$deploy" == "true" ]]; then
            frontend=true
            backend=true
            ai=true
            migrations=true
          fi
          for output in frontend backend ai migrations; do
            echo "$output=${!output}" >> "$GITHUB_OUTPUT"
          done
          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"
          echo "Release selection for $RELEASE_SHA: $(jq -c . "$manifest")"

  build-images:
    name: Build, publish, and scan images
    needs: release-gate
    if: needs.release-gate.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    outputs:
      ai-image: ${{ steps.images.outputs.ai-image }}
      backend-image: ${{ steps.images.outputs.backend-image }}
      frontend-image: ${{ steps.images.outputs.frontend-image }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_SHA }}
          persist-credentials: false
      - name: Validate publishing configuration
        env:
          PUBLISH_ROLE: ${{ vars.AWS_PUBLISH_ROLE_ARN }}
          AI_CHANGED: ${{ needs.release-gate.outputs.ai }}
          BACKEND_CHANGED: ${{ needs.release-gate.outputs.backend }}
          FRONTEND_CHANGED: ${{ needs.release-gate.outputs.frontend }}
          AI_REPOSITORY: ${{ vars.ECR_AI_REPOSITORY }}
          BACKEND_REPOSITORY: ${{ vars.ECR_BACKEND_REPOSITORY }}
          FRONTEND_REPOSITORY: ${{ vars.ECR_FRONTEND_REPOSITORY }}
        run: |
          [[ -n "$PUBLISH_ROLE" ]] || { echo "Missing PUBLISH_ROLE" >&2; exit 1; }
          [[ "$AI_CHANGED" != "true" || -n "$AI_REPOSITORY" ]] || \
            { echo "Missing AI_REPOSITORY" >&2; exit 1; }
          [[ "$BACKEND_CHANGED" != "true" || -n "$BACKEND_REPOSITORY" ]] || \
            { echo "Missing BACKEND_REPOSITORY" >&2; exit 1; }
          [[ "$FRONTEND_CHANGED" != "true" || -n "$FRONTEND_REPOSITORY" ]] || \
            { echo "Missing FRONTEND_REPOSITORY" >&2; exit 1; }
      - name: Report non-secret OIDC claims
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          import urllib.request

          url = f"{os.environ['ACTIONS_ID_TOKEN_REQUEST_URL']}&audience=sts.amazonaws.com"
          request = urllib.request.Request(
              url,
              headers={
                  "Authorization": f"bearer {os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN']}"
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              token = json.load(response)["value"]
          encoded_payload = token.split(".")[1]
          encoded_payload += "=" * (-len(encoded_payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(encoded_payload))
          safe_claims = {
              name: claims.get(name)
              for name in (
                  "iss",
                  "aud",
                  "sub",
                  "repository",
                  "repository_id",
                  "repository_owner",
                  "repository_owner_id",
                  "ref",
                  "environment",
              )
              if claims.get(name) is not None
          }
          print(json.dumps(safe_claims, sort_keys=True))
          PY
      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_PUBLISH_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push immutable images
        id: images
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          AI_CHANGED: ${{ needs.release-gate.outputs.ai }}
          BACKEND_CHANGED: ${{ needs.release-gate.outputs.backend }}
          FRONTEND_CHANGED: ${{ needs.release-gate.outputs.frontend }}
          AI_REPOSITORY: ${{ vars.ECR_AI_REPOSITORY }}
          BACKEND_REPOSITORY: ${{ vars.ECR_BACKEND_REPOSITORY }}
          FRONTEND_REPOSITORY: ${{ vars.ECR_FRONTEND_REPOSITORY }}
        run: |
          publish_image() {
            local repository="$1" dockerfile="$2" output_name="$3"
            local image="$ECR_REGISTRY/$repository:$RELEASE_SHA"
            if aws ecr describe-images --repository-name "$repository" \
              --image-ids "imageTag=$RELEASE_SHA" >/dev/null 2>&1; then
              echo "Reusing existing immutable image: $image"
            else
              docker build --label "org.opencontainers.image.revision=$RELEASE_SHA" \
                -f "$dockerfile" -t "$image" .
              docker push "$image"
            fi
            echo "$output_name=$image" >> "$GITHUB_OUTPUT"
          }
          if [[ "$AI_CHANGED" == "true" ]]; then
            publish_image "$AI_REPOSITORY" infra/docker/Dockerfile.ai-service ai-image
          fi
          if [[ "$BACKEND_CHANGED" == "true" ]]; then
            publish_image "$BACKEND_REPOSITORY" infra/docker/Dockerfile.backend backend-image
          fi
          if [[ "$FRONTEND_CHANGED" == "true" ]]; then
            publish_image "$FRONTEND_REPOSITORY" infra/docker/Dockerfile.frontend frontend-image
          fi
      - name: Gate on Amazon ECR and Inspector findings
        env:
          AI_CHANGED: ${{ needs.release-gate.outputs.ai }}
          BACKEND_CHANGED: ${{ needs.release-gate.outputs.backend }}
          FRONTEND_CHANGED: ${{ needs.release-gate.outputs.frontend }}
          AI_REPOSITORY: ${{ vars.ECR_AI_REPOSITORY }}
          BACKEND_REPOSITORY: ${{ vars.ECR_BACKEND_REPOSITORY }}
          FRONTEND_REPOSITORY: ${{ vars.ECR_FRONTEND_REPOSITORY }}
        run: |
          if [[ "$AI_CHANGED" == "true" ]]; then
            python infra/scripts/ecr_scan_gate.py \
              --repository "$AI_REPOSITORY" --image-tag "$RELEASE_SHA"
          fi
          if [[ "$BACKEND_CHANGED" == "true" ]]; then
            python infra/scripts/ecr_scan_gate.py \
              --repository "$BACKEND_REPOSITORY" --image-tag "$RELEASE_SHA"
          fi
          if [[ "$FRONTEND_CHANGED" == "true" ]]; then
            python infra/scripts/ecr_scan_gate.py \
              --repository "$FRONTEND_REPOSITORY" --image-tag "$RELEASE_SHA"
          fi

  deploy-demo:
    name: Deploy demo environment
    needs: [release-gate, build-images]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment:
      name: demo
      url: ${{ vars.FRONTEND_URL }}
    permissions:
      contents: read
      id-token: write
    env:
      AI_CHANGED: ${{ needs.release-gate.outputs.ai }}
      BACKEND_CHANGED: ${{ needs.release-gate.outputs.backend }}
      FRONTEND_CHANGED: ${{ needs.release-gate.outputs.frontend }}
      MIGRATIONS_CHANGED: ${{ needs.release-gate.outputs.migrations }}
      DEPLOY_ROLE: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
      ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
      AI_SERVICE: ${{ vars.ECS_AI_SERVICE }}
      BACKEND_SERVICE: ${{ vars.ECS_BACKEND_SERVICE }}
      FRONTEND_SERVICE: ${{ vars.ECS_FRONTEND_SERVICE }}
      AI_TASK_FAMILY: ${{ vars.ECS_AI_TASK_FAMILY }}
      BACKEND_TASK_FAMILY: ${{ vars.ECS_BACKEND_TASK_FAMILY }}
      FRONTEND_TASK_FAMILY: ${{ vars.ECS_FRONTEND_TASK_FAMILY }}
      AI_CONTAINER_NAME: ${{ vars.ECS_AI_CONTAINER_NAME }}
      BACKEND_CONTAINER_NAME: ${{ vars.ECS_BACKEND_CONTAINER_NAME }}
      FRONTEND_CONTAINER_NAME: ${{ vars.ECS_FRONTEND_CONTAINER_NAME }}
      FRONTEND_URL: ${{ vars.FRONTEND_URL }}
      FRONTEND_HEALTH_URL: ${{ vars.FRONTEND_HEALTH_URL }}
      BACKEND_HEALTH_URL: ${{ vars.BACKEND_HEALTH_URL }}
      COACH_SMOKE_URL: ${{ vars.COACH_SMOKE_URL }}
      SMOKE_BACKEND_API_KEY: ${{ secrets.SMOKE_BACKEND_API_KEY }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_SHA }}
          persist-credentials: false
      - name: Verify release is still current main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          main_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [[ "$RELEASE_SHA" != "$main_sha" ]]; then
            echo "Release SHA $RELEASE_SHA became stale; current main is $main_sha." >&2
            exit 1
          fi
      - name: Load packaged corpus versions
        run: |
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          versions = {}
          for name, directory in (
              ("EDUCATION_CORPUS_VERSION", "investment_education"),
              ("POLICY_CORPUS_VERSION", "policy_controls"),
          ):
              manifest = Path("knowledge") / directory / "source_manifest.json"
              version = json.loads(manifest.read_text())["corpus_version"]
              if (
                  not isinstance(version, str)
                  or not re.fullmatch(r"[a-z0-9][a-z0-9@._-]{2,127}", version)
                  or version.endswith("@local-fixture-v1")
              ):
                  raise SystemExit(f"Invalid deployed corpus version in {manifest}")
              versions[name] = version
          with open(os.environ["GITHUB_ENV"], "a") as output:
              for name, version in versions.items():
                  output.write(f"{name}={version}\n")
          PY
      - name: Validate deployment configuration
        run: |
          required=(
            DEPLOY_ROLE ECS_CLUSTER
            FRONTEND_URL FRONTEND_HEALTH_URL BACKEND_HEALTH_URL
            COACH_SMOKE_URL EDUCATION_CORPUS_VERSION POLICY_CORPUS_VERSION
            SMOKE_BACKEND_API_KEY
          )
          if [[ "$AI_CHANGED" == "true" ]]; then
            required+=(AI_SERVICE AI_TASK_FAMILY AI_CONTAINER_NAME)
          fi
          if [[ "$BACKEND_CHANGED" == "true" ]]; then
            required+=(BACKEND_SERVICE BACKEND_TASK_FAMILY BACKEND_CONTAINER_NAME)
          fi
          if [[ "$FRONTEND_CHANGED" == "true" ]]; then
            required+=(FRONTEND_SERVICE FRONTEND_TASK_FAMILY FRONTEND_CONTAINER_NAME)
          fi
          for name in "${required[@]}"; do
            if [[ -z "${!name}" ]]; then
              echo "Missing demo environment variable or secret: $name" >&2
              exit 1
            fi
          done
      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true
      - name: Verify ECS rollback protection and capture current revisions
        run: |
          services=()
          [[ "$AI_CHANGED" != "true" ]] || services+=("$AI_SERVICE")
          [[ "$BACKEND_CHANGED" != "true" ]] || services+=("$BACKEND_SERVICE")
          [[ "$FRONTEND_CHANGED" != "true" ]] || services+=("$FRONTEND_SERVICE")
          for service in "${services[@]}"; do
            enabled=$(aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$service" \
              --query 'services[0].deploymentConfiguration.deploymentCircuitBreaker.enable' \
              --output text)
            rollback=$(aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$service" \
              --query 'services[0].deploymentConfiguration.deploymentCircuitBreaker.rollback' \
              --output text)
            if [[ "$enabled" != "True" || "$rollback" != "True" ]]; then
              echo "ECS circuit breaker with rollback must be enabled for $service" >&2
              exit 1
            fi
          done

          if [[ "$AI_CHANGED" == "true" ]]; then
            previous=$(aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$AI_SERVICE" \
              --query 'services[0].taskDefinition' --output text)
            echo "AI_PREVIOUS_TASK_DEFINITION=$previous" >> "$GITHUB_ENV"
          fi
          if [[ "$BACKEND_CHANGED" == "true" ]]; then
            previous=$(aws ecs describe-services --cluster "$ECS_CLUSTER" \
              --services "$BACKEND_SERVICE" --query 'services[0].taskDefinition' --output text)
            echo "BACKEND_PREVIOUS_TASK_DEFINITION=$previous" >> "$GITHUB_ENV"
          fi
          if [[ "$FRONTEND_CHANGED" == "true" ]]; then
            previous=$(aws ecs describe-services --cluster "$ECS_CLUSTER" \
              --services "$FRONTEND_SERVICE" --query 'services[0].taskDefinition' --output text)
            echo "FRONTEND_PREVIOUS_TASK_DEFINITION=$previous" >> "$GITHUB_ENV"
          fi
      - name: Download current task definitions
        run: |
          if [[ "$AI_CHANGED" == "true" ]]; then
            aws ecs describe-task-definition --task-definition "$AI_TASK_FAMILY" \
              --query taskDefinition > ai-task-definition.json
          fi
          if [[ "$BACKEND_CHANGED" == "true" ]]; then
            aws ecs describe-task-definition --task-definition "$BACKEND_TASK_FAMILY" \
              --query taskDefinition > backend-task-definition.json
          fi
          if [[ "$FRONTEND_CHANGED" == "true" ]]; then
            aws ecs describe-task-definition --task-definition "$FRONTEND_TASK_FAMILY" \
              --query taskDefinition > frontend-task-definition.json
          fi
      - name: Render AI service task definition
        id: render-ai
        if: needs.release-gate.outputs.ai == 'true'
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ai-task-definition.json
          container-name: ${{ env.AI_CONTAINER_NAME }}
          image: ${{ needs.build-images.outputs.ai-image }}
          environment-variables: |
            APP_ENV=demo
            MODEL_PROVIDER=openai
            MODEL_ID=gpt-6-luna
            MODEL_REASONING_EFFORT=low
            PROMPT_SET_VERSION=v6
            RAG_PROVIDER=local_documents
            POLICY_RAG_PROVIDER=local_documents
            EDUCATION_CORPUS_VERSION=${{ env.EDUCATION_CORPUS_VERSION }}
            POLICY_CORPUS_VERSION=${{ env.POLICY_CORPUS_VERSION }}
      - name: Verify AI runtime configuration has not drifted
        if: needs.release-gate.outputs.ai == 'true'
        env:
          RENDERED_AI_TASK: ${{ steps.render-ai.outputs.task-definition }}
        run: >-
          python infra/scripts/verify_ecs_task_config.py
          --task-definition "$RENDERED_AI_TASK"
          --container "$AI_CONTAINER_NAME"
          --expect APP_ENV=demo
          --expect MODEL_PROVIDER=openai
          --expect MODEL_ID=gpt-6-luna
          --expect MODEL_REASONING_EFFORT=low
          --expect PROMPT_SET_VERSION=v6
          --expect RAG_PROVIDER=local_documents
          --expect POLICY_RAG_PROVIDER=local_documents
          --expect "EDUCATION_CORPUS_VERSION=$EDUCATION_CORPUS_VERSION"
          --expect "POLICY_CORPUS_VERSION=$POLICY_CORPUS_VERSION"
          --require-secret OPENAI_API_KEY
      - name: Deploy AI service
        if: needs.release-gate.outputs.ai == 'true'
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-ai.outputs.task-definition }}
          cluster: ${{ env.ECS_CLUSTER }}
          service: ${{ env.AI_SERVICE }}
          wait-for-service-stability: true
          enable-ecs-managed-tags: true
          propagate-tags: SERVICE
      - name: Record AI deployment
        if: needs.release-gate.outputs.ai == 'true'
        run: echo "AI_DEPLOYED=true" >> "$GITHUB_ENV"
      - name: Render application backend task definition
        id: render-backend
        if: needs.release-gate.outputs.backend == 'true'
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: backend-task-definition.json
          container-name: ${{ env.BACKEND_CONTAINER_NAME }}
          image: ${{ needs.build-images.outputs.backend-image }}
          environment-variables: |
            TRACE_RETENTION_DAYS=30
            CHAT_RETENTION_DAYS=90
            SYNTHETIC_USER_RETENTION_DAYS=30
            DURABLE_AGENT_MEMORY_ENABLED=false
      - name: Verify backend data-lifecycle configuration has not drifted
        if: needs.release-gate.outputs.backend == 'true'
        env:
          RENDERED_BACKEND_TASK: ${{ steps.render-backend.outputs.task-definition }}
        run: >-
          python infra/scripts/verify_ecs_task_config.py
          --task-definition "$RENDERED_BACKEND_TASK"
          --container "$BACKEND_CONTAINER_NAME"
          --expect TRACE_RETENTION_DAYS=30
          --expect CHAT_RETENTION_DAYS=90
          --expect SYNTHETIC_USER_RETENTION_DAYS=30
          --expect DURABLE_AGENT_MEMORY_ENABLED=false
      - name: Apply and verify database migrations as a one-shot task
        if: needs.release-gate.outputs.backend == 'true'
        env:
          RENDERED_BACKEND_TASK: ${{ steps.render-backend.outputs.task-definition }}
        run: |
          network_configuration=$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" --services "$BACKEND_SERVICE" \
            --query 'services[0].networkConfiguration' --output json)
          migration_task_definition=$(aws ecs register-task-definition \
            --cli-input-json "file://$RENDERED_BACKEND_TASK" \
            --query 'taskDefinition.taskDefinitionArn' --output text)
          overrides=$(jq -nc --arg name "$BACKEND_CONTAINER_NAME" \
            '{containerOverrides:[{name:$name,command:["alembic","upgrade","head"]}]}')
          run_result=$(aws ecs run-task \
            --cluster "$ECS_CLUSTER" \
            --task-definition "$migration_task_definition" \
            --launch-type FARGATE \
            --network-configuration "$network_configuration" \
            --overrides "$overrides")
          if [[ $(jq '.failures | length' <<< "$run_result") -ne 0 ]]; then
            jq '.failures' <<< "$run_result" >&2
            exit 1
          fi
          migration_task=$(jq -r '.tasks[0].taskArn' <<< "$run_result")
          aws ecs wait tasks-stopped --cluster "$ECS_CLUSTER" --tasks "$migration_task"
          exit_code=$(aws ecs describe-tasks \
            --cluster "$ECS_CLUSTER" --tasks "$migration_task" \
            --query "tasks[0].containers[?name=='$BACKEND_CONTAINER_NAME'].exitCode | [0]" \
            --output text)
          if [[ "$exit_code" != "0" ]]; then
            aws ecs describe-tasks --cluster "$ECS_CLUSTER" --tasks "$migration_task" \
              --query 'tasks[0].{stoppedReason:stoppedReason,containers:containers[*].{name:name,reason:reason,exitCode:exitCode}}'
            exit 1
          fi
      - name: Deploy application backend
        if: needs.release-gate.outputs.backend == 'true'
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-backend.outputs.task-definition }}
          cluster: ${{ env.ECS_CLUSTER }}
          service: ${{ env.BACKEND_SERVICE }}
          wait-for-service-stability: true
          enable-ecs-managed-tags: true
          propagate-tags: SERVICE
      - name: Record backend deployment
        if: needs.release-gate.outputs.backend == 'true'
        run: echo "BACKEND_DEPLOYED=true" >> "$GITHUB_ENV"
      - name: Render Streamlit task definition
        id: render-frontend
        if: needs.release-gate.outputs.frontend == 'true'
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: frontend-task-definition.json
          container-name: ${{ env.FRONTEND_CONTAINER_NAME }}
          image: ${{ needs.build-images.outputs.frontend-image }}
      - name: Deploy Streamlit frontend
        if: needs.release-gate.outputs.frontend == 'true'
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-frontend.outputs.task-definition }}
          cluster: ${{ env.ECS_CLUSTER }}
          service: ${{ env.FRONTEND_SERVICE }}
          wait-for-service-stability: true
          enable-ecs-managed-tags: true
          propagate-tags: SERVICE
      - name: Record frontend deployment
        if: needs.release-gate.outputs.frontend == 'true'
        run: echo "FRONTEND_DEPLOYED=true" >> "$GITHUB_ENV"
      - name: Run health and AI safety smoke tests
        run: >-
          python infra/scripts/post_deploy_smoke.py
          --frontend-health-url "$FRONTEND_HEALTH_URL"
          --backend-health-url "$BACKEND_HEALTH_URL"
          --coach-url "$COACH_SMOKE_URL"
          --expected-corpus-version "$EDUCATION_CORPUS_VERSION"
          --expected-policy-corpus-version "$POLICY_CORPUS_VERSION"
          --persistence-base-url "${COACH_SMOKE_URL%/coach}"
          --api-key "$SMOKE_BACKEND_API_KEY"
      - name: Roll back services when post-deploy checks fail
        if: >-
          failure() &&
          (env.AI_DEPLOYED == 'true' ||
           env.BACKEND_DEPLOYED == 'true' ||
           env.FRONTEND_DEPLOYED == 'true')
        run: |
          services=()
          if [[ "$AI_DEPLOYED" == "true" ]]; then
            aws ecs update-service --cluster "$ECS_CLUSTER" --service "$AI_SERVICE" \
              --task-definition "$AI_PREVIOUS_TASK_DEFINITION"
            services+=("$AI_SERVICE")
          fi
          if [[ "$BACKEND_DEPLOYED" == "true" ]]; then
            aws ecs update-service --cluster "$ECS_CLUSTER" --service "$BACKEND_SERVICE" \
              --task-definition "$BACKEND_PREVIOUS_TASK_DEFINITION"
            services+=("$BACKEND_SERVICE")
          fi
          if [[ "$FRONTEND_DEPLOYED" == "true" ]]; then
            aws ecs update-service --cluster "$ECS_CLUSTER" --service "$FRONTEND_SERVICE" \
              --task-definition "$FRONTEND_PREVIOUS_TASK_DEFINITION"
            services+=("$FRONTEND_SERVICE")
          fi
          aws ecs wait services-stable --cluster "$ECS_CLUSTER" --services "${services[@]}"
