name: Budget Agent Tests

# CI owns automatic execution; dispatch retains focused troubleshooting runs.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: budget-agent-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  offline:
    name: Offline budget contracts
    uses: ./.github/workflows/agent-test-suite.yml
    with:
      suite: budget-offline
      label: "Offline budget contracts"

  functional:
    name: Functional tests — ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: capture
            label: "Capture and saved records"
          - group: reasoning
            label: "Reasoning and reviews"
          - group: boundaries
            label: "Scoped reads and education gaps"
    uses: ./.github/workflows/agent-test-suite.yml
    with:
      suite: budget-functional-${{ matrix.group }}
      label: "Budget Agent Tests — ${{ matrix.label }}"
