name: Policy RAG Source Governance

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Validate packaged Education and Policy corpora
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/ai-service/pyproject.toml
      - name: Install corpus validation runtime
        run: python -m pip install -e "apps/ai-service[dev]"
      - name: Verify manifests and exact documents
        run: python infra/scripts/validate_packaged_corpora.py
