name: Budget Live Acceptance

on:
  workflow_dispatch:
    inputs:
      repeats:
        description: Repetitions per Budget case (1 to 3)
        required: true
        default: "2"

permissions:
  contents: read

concurrency:
  group: budget-live-acceptance-demo
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: demo
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Run focused live Budget acceptance
        env:
          COACH_URL: ${{ vars.COACH_SMOKE_URL }}
          SMOKE_BACKEND_API_KEY: ${{ secrets.SMOKE_BACKEND_API_KEY }}
          REPEATS: ${{ inputs.repeats }}
        run: |
          [[ "$REPEATS" =~ ^[1-3]$ ]] || exit 1
          [[ -n "$COACH_URL" && -n "$SMOKE_BACKEND_API_KEY" ]] || exit 1
          python infra/scripts/live_evaluation.py \
            --url "$COACH_URL" --api-key "$SMOKE_BACKEND_API_KEY" \
            --cases infra/llmsecops/budget-live-evaluation-cases.jsonl \
            --repeats "$REPEATS" --expected-model-id gpt-6-luna \
            --maximum-p95-ms 30000 --maximum-estimated-cost-usd 0.05 \
            --output artifacts/budget-live-acceptance.json
      - name: Verify multi-turn edits and confirmation against the live model
        env:
          COACH_URL: ${{ vars.COACH_SMOKE_URL }}
          SMOKE_BACKEND_API_KEY: ${{ secrets.SMOKE_BACKEND_API_KEY }}
        run: python infra/scripts/budget_multiturn_acceptance.py
      - name: Retain privacy-safe evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: budget-live-acceptance-${{ github.run_id }}
          path: artifacts/budget-*-acceptance.json
          if-no-files-found: warn
          retention-days: 90
