name: Bedrock Model Comparison

on:
  workflow_dispatch:
    inputs:
      repeats:
        description: Repetitions of each model-comparison case
        required: true
        default: "3"

concurrency:
  group: bedrock-model-comparison-demo
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  compare:
    name: Compare approved Bedrock models
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: demo
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/ai-service/pyproject.toml
      - name: Install comparison runtime
        run: python -m pip install -e "apps/ai-service[dev]"
      - name: Validate model-comparison policy and harness
        run: >-
          python -m pytest
          infra/scripts/tests/test_model_comparison.py
      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ap-southeast-1' }}
          mask-aws-account-id: true
      - name: Compare Nova Lite and Nova Micro
        run: >-
          python infra/scripts/model_comparison.py
          --policy infra/llmsecops/model-comparison-policy.json
          --output artifacts/model-comparison.json
          --human-review-output artifacts/model-comparison-human-review.csv
          --review-key-output artifacts/model-comparison-review-key.json
          --repeats "${{ inputs.repeats }}"
      - name: Upload privacy-safe model-comparison evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bedrock-model-comparison-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 90
