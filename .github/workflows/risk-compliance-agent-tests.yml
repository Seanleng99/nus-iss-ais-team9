name: Risk & Compliance Agent Tests

# CI owns automatic execution; dispatch retains focused troubleshooting runs.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: risk-compliance-agent-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  offline:
    name: Offline risk-compliance contracts
    uses: ./.github/workflows/agent-test-suite.yml
    with:
      suite: risk-compliance-offline
      label: "Offline risk-compliance contracts"

  functional:
    name: Functional tests — ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: blocks
            label: "Blocks unsafe requests"
          - group: withholds
            label: "Withholds unsafe answers"
          - group: allows
            label: "Allows safe answers"
    uses: ./.github/workflows/agent-test-suite.yml
    with:
      suite: risk-compliance-functional-${{ matrix.group }}
      label: "Risk & Compliance Agent Tests — ${{ matrix.label }}"
