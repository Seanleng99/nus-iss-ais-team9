name: CI and LLMSecOps

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * 1"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  assessment-evidence:
    name: Validate assessment repository evidence inventory
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Validate assessment inventory and workflow coverage
        run: >-
          python infra/scripts/final_assessment.py
          --manifest infra/llmsecops/final-assessment-manifest.json
          --output artifacts/final-assessment.json
          --markdown-output artifacts/final-assessment-summary.md

      - name: Publish assessment summary
        run: cat artifacts/final-assessment-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload privacy-safe assessment evidence
        uses: actions/upload-artifact@v7
        with:
          name: final-assessment-evidence-${{ github.run_id }}
          path: |
            artifacts/final-assessment.json
            artifacts/final-assessment-summary.md
          if-no-files-found: error
          retention-days: 90

  changes:
    name: Detect affected services
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      frontend_ci: ${{ steps.classify.outputs.frontend_ci }}
      backend_ci: ${{ steps.classify.outputs.backend_ci }}
      ai_ci: ${{ steps.classify.outputs.ai_ci }}
      infrastructure: ${{ steps.classify.outputs.infrastructure }}
      integration: ${{ steps.classify.outputs.integration }}
      sast: ${{ steps.classify.outputs.sast }}
      frontend_deploy: ${{ steps.classify.outputs.frontend_deploy }}
      backend_deploy: ${{ steps.classify.outputs.backend_deploy }}
      ai_deploy: ${{ steps.classify.outputs.ai_deploy }}
      migrations: ${{ steps.classify.outputs.migrations }}
      deploy: ${{ steps.classify.outputs.deploy }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test change classifier
        run: python -m unittest discover -s infra/scripts/tests -p 'test_detect_changes.py'
      - name: Test deployment baseline selection
        run: python -m unittest discover -s infra/scripts/tests -p 'test_deployment_baseline.py'
      - name: Keep Chinese language data out of code
        run: >-
          python scripts/scan_chinese.py
          --output artifacts/chinese-character-inventory.json
          --check-code
      - id: deployment-baseline
        name: Find last successful application deployment
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python infra/scripts/deployment_baseline.py
          --repository "$GITHUB_REPOSITORY"
          --json-output artifacts/deployment-baseline.json
          --github-output "$GITHUB_OUTPUT"
      - id: classify
        name: Classify changed paths
        env:
          EVENT_NAME: ${{ github.event_name }}
          DEPLOYED_SHA: ${{ steps.deployment-baseline.outputs.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mkdir -p artifacts
          if [[ "$EVENT_NAME" == "schedule" || "$EVENT_NAME" == "workflow_dispatch" || ( "$EVENT_NAME" == "push" && -z "$DEPLOYED_SHA" ) ]]; then
            python infra/scripts/detect_changes.py --all \
              --json-output artifacts/change-manifest.json \
              --github-output "$GITHUB_OUTPUT"
          else
            if [[ "$EVENT_NAME" == "pull_request" ]]; then
              git diff --name-only "$BASE_SHA" "$HEAD_SHA" > artifacts/changed-files.txt
            else
              git diff --name-only "$DEPLOYED_SHA" "$HEAD_SHA" > artifacts/changed-files.txt
            fi
            python infra/scripts/detect_changes.py \
              --changed-files artifacts/changed-files.txt \
              --json-output artifacts/change-manifest.json \
              --github-output "$GITHUB_OUTPUT"
          fi
      - name: Upload change manifest
        uses: actions/upload-artifact@v7
        with:
          name: change-manifest
          path: |
            artifacts/change-manifest.json
            artifacts/deployment-baseline.json
          if-no-files-found: error
          retention-days: 7

  offline:
    name: ${{ matrix.suite }} — offline regression tests
    needs: changes
    if: needs.changes.outputs.ai_ci == 'true' || needs.changes.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        suite: [orchestrator, spending, budget, goal, investment, risk-compliance, rag]
    env:
      MODEL_PROVIDER: local_fixture
      RAG_PROVIDER: local_fixture
      POLICY_RAG_PROVIDER: local_fixture
      SUITE: ${{ matrix.suite }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            apps/shared/pyproject.toml
            apps/ai-service/pyproject.toml
      - name: Install offline test dependencies
        run: python -m pip install -e "apps/shared" -e "apps/ai-service[dev]"
      - name: Run all owned tests and question-response examples
        run: python infra/scripts/run_agent_tests.py --suite "$SUITE" --junitxml="artifacts/$SUITE.xml"
      - name: Publish dataset, criteria, metrics and actual responses
        if: always()
        run: >-
          python infra/scripts/summarize_pytest_junit.py "artifacts/$SUITE.xml"
          --output "artifacts/$SUITE-summary.md" --title "$SUITE offline (fixture; no live model)"
          --suite "$SUITE" --evaluation-output "artifacts/$SUITE-evaluation.json"
      - name: Retain full offline evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: agent-offline-${{ matrix.suite }}
          path: |
            artifacts/${{ matrix.suite }}.xml
            artifacts/${{ matrix.suite }}-summary.md
            artifacts/${{ matrix.suite }}-evaluation.json
            infra/llmsecops/agent-evaluation-specs.json
            apps/ai-service/app/evals/datasets/agent_offline_examples.jsonl
          if-no-files-found: error
          retention-days: 90

  metrics:
    name: Required evaluation metrics
    needs: changes
    if: needs.changes.outputs.ai_ci == 'true' || needs.changes.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MODEL_PROVIDER: local_fixture
      RAG_PROVIDER: local_fixture
      POLICY_RAG_PROVIDER: local_fixture
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            apps/shared/pyproject.toml
            apps/ai-service/pyproject.toml
      - name: Install evaluation dependencies
        run: python -m pip install -e "apps/shared" -e "apps/ai-service[dev]"
      - name: Enforce LLMSecOps evaluation policy
        run: >-
          python -m app.evals.gate
          --policy infra/llmsecops/evaluation-policy.json
          --output artifacts/llm-evaluation-results.json
      - name: Enforce full-document RAG evidence quality
        if: always()
        run: >-
          python -m app.evals.rag_evidence
          --dataset apps/ai-service/app/evals/datasets/rag_evidence_v1.jsonl
          --output artifacts/rag-evidence-results.json
      - name: Publish evaluation definitions and metrics
        if: always()
        run: >-
          python infra/scripts/summarize_investment_evaluations.py
          --evaluation artifacts/llm-evaluation-results.json
          --retrieval artifacts/rag-evidence-results.json
          --output artifacts/investment-evaluation-summary.md
      - name: Upload evaluation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: investment-evaluation-metrics
          path: |
            artifacts/llm-evaluation-results.json
            artifacts/rag-evidence-results.json
            artifacts/investment-evaluation-summary.md
            infra/llmsecops/agent-evaluation-specs.json
            infra/llmsecops/evaluation-policy.json
            apps/ai-service/app/evals/datasets/orchestrator_routing.jsonl
            apps/ai-service/app/evals/datasets/budget_calculation.jsonl
            apps/ai-service/app/evals/datasets/rag_retrieval.jsonl
            apps/ai-service/app/evals/datasets/rag_evidence_v1.jsonl
            apps/ai-service/app/evals/datasets/rag_integration.jsonl
            apps/ai-service/app/evals/datasets/security_guardrails.jsonl
            apps/ai-service/app/evals/datasets/policy_retrieval.jsonl
            apps/ai-service/app/evals/datasets/dynamic_dependencies.jsonl
            apps/ai-service/app/evals/datasets/safety_behavior.jsonl
            apps/ai-service/app/evals/datasets/fairness_consistency.jsonl
            apps/ai-service/app/evals/datasets/beginner_investment_questions.jsonl
          if-no-files-found: error
          retention-days: 30

  project-security-scan:
    name: Promptfoo — all agents and router (offline)
    needs: changes
    if: needs.changes.outputs.sast == 'true' || needs.changes.outputs.ai_ci == 'true' || needs.changes.outputs.deploy == 'true'
    env:
      PROMPTFOO_DISABLE_TELEMETRY: '1'
      PROMPTFOO_DISABLE_UPDATE: '1'
      PROMPTFOO_DISABLE_REMOTE_GENERATION: 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            apps/shared/pyproject.toml
            apps/ai-service/pyproject.toml
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: security/promptfoo/package-lock.json
      - name: Install scan dependencies
        run: |
          npm install --global npm@11.6.2
          python -m pip install -e "apps/shared" -e "apps/ai-service[dev]"
          npm ci --prefix security/promptfoo
      - name: Verify provider, grader and report failure detection
        run: |
          ruff check security/promptfoo/provider.py security/promptfoo/run_bounded.py security/promptfoo/model_support.py security/promptfoo/tests/test_provider.py
          python -m pytest -v security/promptfoo/tests/test_provider.py
          node --test security/promptfoo/tests/assertions.test.cjs
      - name: Run Promptfoo OWASP-mapped regression cases
        env:
          PROMPTFOO_MODEL_MODE: offline
          PROMPTFOO_CONFIG_DIR: ${{ runner.temp }}/promptfoo
        run: |
          mkdir -p artifacts
          export PROMPTFOO_PYTHON="$(command -v python)"
          security/promptfoo/node_modules/.bin/promptfoo eval \
            -c security/promptfoo/promptfooconfig.yaml \
            --no-cache --no-share --no-progress-bar --max-concurrency 1 \
            -o artifacts/promptfoo-offline.json -o artifacts/promptfoo-offline.html \
            > artifacts/promptfoo-offline-cli.log 2>&1
      - name: Show test methods, questions, responses and results
        if: always()
        run: >-
          python infra/scripts/summarize_promptfoo.py artifacts/promptfoo-offline.json
          --output artifacts/promptfoo-offline-summary.md
          --title "Project Promptfoo results — offline fixtures"
      - name: Upload Promptfoo JSON and HTML reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: project-promptfoo-offline
          path: artifacts/promptfoo-offline*
          if-no-files-found: error
          retention-days: 7

  agent-test-gate:
    name: Required agent test gate
    needs: [changes, offline, metrics, ai-service]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      CHANGES_RESULT: ${{ needs.changes.result }}
      AI_CI: ${{ needs.changes.outputs.ai_ci }}
      DEPLOY: ${{ needs.changes.outputs.deploy }}
      OFFLINE_RESULT: ${{ needs.offline.result }}
      METRICS_RESULT: ${{ needs.metrics.result }}
      PLATFORM_RESULT: ${{ needs.ai-service.result }}
    steps:
      - name: Require every selected agent suite to pass
        run: |
          [[ "$CHANGES_RESULT" == "success" ]] || exit 1
          if [[ "$AI_CI" == "true" || "$DEPLOY" == "true" ]]; then
            [[ "$OFFLINE_RESULT" == "success" && "$METRICS_RESULT" == "success" && "$PLATFORM_RESULT" == "success" ]] || { echo "Agent suites, platform/shared contracts or metrics did not pass." >&2; exit 1; }
            echo "All seven offline suites, platform/shared contracts, ownership validation and required metrics passed. Live acceptance is required after deployment in Release to AWS." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Agent suites are not required for this change." >> "$GITHUB_STEP_SUMMARY"
          fi

  ai-service:
    name: AI platform and shared contracts
    needs: changes
    if: needs.changes.outputs.ai_ci == 'true' || needs.changes.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MODEL_PROVIDER: local_fixture
      RAG_PROVIDER: local_fixture
      POLICY_RAG_PROVIDER: local_fixture
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/ai-service/pyproject.toml
      - name: Install FastAPI service
        run: python -m pip install -e "apps/shared" -e "apps/ai-service[dev]"
      - name: Lint
        run: ruff check apps/ai-service apps/shared infra/scripts
      - name: Require complete and disjoint test ownership
        run: python infra/scripts/check_test_ownership.py --output artifacts/test-ownership.json
      - name: AI platform contracts
        run: >-
          python infra/scripts/run_agent_tests.py --suite platform
          --junitxml=artifacts/platform.xml
      - name: Publish platform contract acceptance
        if: always()
        run: >-
          python infra/scripts/summarize_pytest_junit.py artifacts/platform.xml
          --output artifacts/platform-summary.md --title "AI platform offline contracts"
          --suite platform --evaluation-output artifacts/platform-evaluation.json
      - name: Upload platform and ownership evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: agent-offline-platform
          path: |
            artifacts/platform.xml
            artifacts/platform-summary.md
            artifacts/platform-evaluation.json
            artifacts/test-ownership.json
            infra/llmsecops/agent-test-suites.json
            infra/llmsecops/agent-evaluation-specs.json
          if-no-files-found: error
          retention-days: 90
      - name: Shared library contracts
        if: ${{ !cancelled() }}
        run: >-
          python infra/scripts/run_agent_tests.py --suite shared
          --junitxml=artifacts/shared.xml
      - name: Publish shared library acceptance
        if: always()
        run: >-
          python infra/scripts/summarize_pytest_junit.py artifacts/shared.xml
          --output artifacts/shared-summary.md --title "Shared library offline contracts"
          --suite shared --evaluation-output artifacts/shared-evaluation.json
      - name: Upload shared library evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: shared-library-contracts
          path: |
            artifacts/shared.xml
            artifacts/shared-summary.md
            artifacts/shared-evaluation.json
            infra/llmsecops/agent-evaluation-specs.json
          if-no-files-found: error
          retention-days: 90

  frontend:
    name: Streamlit tests
    needs: changes
    if: needs.changes.outputs.frontend_ci == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/frontend/pyproject.toml
      - name: Install Streamlit frontend
        run: python -m pip install -e "../shared" -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Unit tests
        run: pytest

  backend:
    name: Backend tests
    needs: changes
    if: needs.changes.outputs.backend_ci == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: financial_wellness
          POSTGRES_USER: coach
          POSTGRES_PASSWORD: coach
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U coach -d financial_wellness"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_URL: postgresql://coach:coach@localhost:5432/financial_wellness
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            apps/backend/pyproject.toml
            apps/ai-service/pyproject.toml
      - name: Install application backend
        run: python -m pip install -e "../shared" -e ".[dev]"
      - name: Install AI runtime for trace protocol contract test
        run: python -m pip install -e "../ai-service"
      - name: Lint
        run: ruff check .
      - name: Apply and verify database migrations
        run: |
          alembic upgrade head
          alembic check
      - name: Unit and API tests
        run: pytest

  infrastructure:
    name: CloudFormation and Compose validation
    needs: changes
    if: needs.changes.outputs.infrastructure == 'true' || needs.changes.outputs.ai_ci == 'true' || needs.changes.outputs.sast == 'true' || needs.changes.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install infrastructure validation tools
        run: >-
          python -m pip install
          "cfn-lint>=1.53,<2"
          "pytest>=8.2,<9"
          -e "apps/shared"
          -e "apps/ai-service"
      - name: Test deployment and operational scripts
        run: >-
          python -m pytest infra/scripts/tests
          --ignore=infra/scripts/tests/test_detect_changes.py
          --ignore=infra/scripts/tests/test_deployment_baseline.py
      - name: Validate AWS templates
        run: cfn-lint infra/aws/*.yaml
      - name: Validate local service graph
        run: docker compose config --quiet

  service-integration:
    name: Backend to AI integration and load smoke
    needs: [changes, ai-service, backend]
    if: >-
      always() &&
      needs.changes.outputs.integration == 'true' &&
      (needs.ai-service.result == 'success' || needs.ai-service.result == 'skipped') &&
      (needs.backend.result == 'success' || needs.backend.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: financial_wellness
          POSTGRES_USER: coach
          POSTGRES_PASSWORD: coach
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U coach -d financial_wellness"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_URL: postgresql://coach:coach@localhost:5432/financial_wellness
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/ai-service/pyproject.toml
      - name: Install shared runtime dependencies
        run: |
          python -m pip install -e "apps/shared" -e "apps/ai-service[dev]"
          python -m pip install -e "apps/backend"
      - name: Apply backend migrations
        working-directory: apps/backend
        run: alembic upgrade head
      - name: Start private services
        env:
          MODEL_PROVIDER: local_fixture
        run: |
          uvicorn app.main:app --app-dir apps/ai-service --host 127.0.0.1 --port 8001 \
            > ai-service.log 2>&1 &
          echo $! > ai-service.pid
          uvicorn app.main:app --app-dir apps/backend --host 127.0.0.1 --port 8080 \
            > backend.log 2>&1 &
          echo $! > backend.pid
      - name: Verify end-to-end safety boundary
        run: >-
          python infra/scripts/post_deploy_smoke.py
          --backend-health-url http://127.0.0.1:8080/health
          --ai-health-url http://127.0.0.1:8001/health
          --coach-url http://127.0.0.1:8080/api/coach
          --persistence-base-url http://127.0.0.1:8080/api
          --api-key change-me-locally
          --expected-model-provider local_fixture
          --expected-corpus-version investment-education-sg@local-fixture-v1
          --expected-policy-corpus-version financial-coach-policy-sg@local-fixture-v1
      - name: Verify bounded concurrency
        run: >-
          python infra/scripts/load_smoke.py
          --url http://127.0.0.1:8080/api/coach
          --api-key change-me-locally
          --requests 20
          --concurrency 2
          --maximum-p95-ms 5000
      - name: Upload service logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: integration-service-logs
          path: "*.log"
          if-no-files-found: ignore
          retention-days: 7

  container-build:
    name: Build hardened containers
    needs: [changes, frontend, backend, ai-service, agent-test-gate, project-security-scan]
    if: >-
      always() &&
      github.event_name != 'push' &&
      needs.changes.outputs.deploy == 'true' &&
      needs.agent-test-gate.result == 'success' &&
      needs.project-security-scan.result == 'success' &&
      (needs.frontend.result == 'success' || needs.frontend.result == 'skipped') &&
      (needs.backend.result == 'success' || needs.backend.result == 'skipped') &&
      (needs.ai-service.result == 'success' || needs.ai-service.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Build AI service image
        if: needs.changes.outputs.ai_deploy == 'true'
        run: docker build -f infra/docker/Dockerfile.ai-service -t coach-ai:ci .
      - name: Build backend image
        if: needs.changes.outputs.backend_deploy == 'true'
        run: docker build -f infra/docker/Dockerfile.backend -t coach-backend:ci .
      - name: Build frontend image
        if: needs.changes.outputs.frontend_deploy == 'true'
        run: docker build -f infra/docker/Dockerfile.frontend -t coach-frontend:ci .
      - name: Verify frontend container health
        if: needs.changes.outputs.frontend_deploy == 'true'
        run: |
          docker run --rm --detach --name coach-frontend-ci -p 8501:8501 coach-frontend:ci
          trap 'docker logs coach-frontend-ci; docker stop coach-frontend-ci >/dev/null 2>&1 || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8501/_stcore/health | grep --quiet --line-regexp ok; then
              exit 0
            fi
            sleep 2
          done
          exit 1

  dependency-review:
    name: Dependency review
    needs: changes
    if: needs.changes.outputs.infrastructure == 'true' || needs.changes.outputs.sast == 'true' || needs.changes.outputs.ai_ci == 'true' || needs.changes.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install pinned dependency auditor
        run: python -m pip install pip-audit==2.10.1
      - name: Audit each service's resolved dependencies
        run: |
          mkdir -p artifacts
          dependency_audit_failed=0
          for service in ai-service backend frontend; do
            python -m venv --upgrade-deps ".audit-venvs/$service"
            ".audit-venvs/$service/bin/python" -m pip install -e "apps/shared" -e "apps/$service[dev]"
            ".audit-venvs/$service/bin/python" -m pip freeze --all --exclude-editable \
              > "artifacts/dependency-versions-$service.txt"
            python -m pip_audit -r "artifacts/dependency-versions-$service.txt" \
              --no-deps --disable-pip --strict --progress-spinner off \
              --format json --output "artifacts/dependency-audit-$service.json" \
              || dependency_audit_failed=1
          done
          exit "$dependency_audit_failed"
      - name: Show dependency audit report and chart
        if: always()
        run: >-
          python infra/scripts/summarize_dependency_audit.py
          artifacts/dependency-audit-ai-service.json
          artifacts/dependency-audit-backend.json
          artifacts/dependency-audit-frontend.json
          --output artifacts/dependency-audit-summary.md
      - name: Upload dependency audit evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dependency-audit-results
          path: |
            artifacts/dependency-audit-*.json
            artifacts/dependency-audit-summary.md
            artifacts/dependency-versions-*.txt
          if-no-files-found: error
          retention-days: 30

  python-sast:
    name: Python SAST (Bandit)
    needs: changes
    if: needs.changes.outputs.sast == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "apps/**/pyproject.toml"
      - name: Install pinned SAST scanner
        run: python -m pip install bandit==1.9.4
      - name: Scan Python source
        run: >-
          bandit -r apps infra/scripts
          -x '*/tests/*'
          --severity-level medium
          --confidence-level medium
          --format json
          --output bandit-results.json
      - name: Upload SAST evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bandit-results
          path: bandit-results.json
          if-no-files-found: error
          retention-days: 30

  report:
    name: Combined CI and evaluation report
    if: always()
    needs: [assessment-evidence, changes, offline, metrics, agent-test-gate, ai-service, frontend, backend, infrastructure, service-integration, container-build, dependency-review, python-sast, project-security-scan]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Reporting preserves CI evidence; release performs mandatory live acceptance.
    continue-on-error: true
    env:
      EVALUATION_PHASE: pre_deployment
      CI_JOB_RESULTS: ${{ toJSON(needs) }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          path: artifacts/collected
      - name: Render every requested evaluation, including missing evidence
        run: python infra/scripts/summarize_agent_evaluations.py --input artifacts/collected --output artifacts/agent-evaluation-report
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: agent-evaluation-report
          path: artifacts/agent-evaluation-report/
          if-no-files-found: error
          retention-days: 90
