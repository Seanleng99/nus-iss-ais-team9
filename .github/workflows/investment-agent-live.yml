name: Investment Agent Live Integration (one time)

# Deliberately no push, schedule, workflow_run or workflow_call trigger.
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type RUN_ONCE to spend live API credits on this single synthetic run
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: investment-live-one-time
  cancel-in-progress: false

jobs:
  arm-once:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      actions: write
    steps:
      - name: Verify one invocation and disable future dispatches
        env:
          GH_TOKEN: ${{ github.token }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          [[ "$GITHUB_REF" == refs/heads/main && "$GITHUB_RUN_ATTEMPT" == 1 && "$CONFIRMATION" == RUN_ONCE ]] || exit 1
          count=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/investment-agent-live.yml/runs?per_page=1" --jq .total_count)
          [[ "$count" == 1 ]] || { echo 'This one-time evaluation already has a run. No live calls allowed.'; exit 1; }
          gh api --method PUT "repos/$GITHUB_REPOSITORY/actions/workflows/investment-agent-live.yml/disable"
          state=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/investment-agent-live.yml" --jq .state)
          [[ "$state" == disabled_manually ]] || exit 1
          echo 'Workflow disabled before live evaluation. This existing run may continue; new dispatches and reruns are prohibited.' >> "$GITHUB_STEP_SUMMARY"

  live:
    name: Real model, Bedrock, ECS and persisted conversation tests
    needs: arm-once
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: demo
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'ap-southeast-1' }}
      DEPLOY_ROLE: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
      ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
      AI_SERVICE: ${{ vars.ECS_AI_SERVICE }}
      BACKEND_SERVICE: ${{ vars.ECS_BACKEND_SERVICE }}
      FRONTEND_SERVICE: ${{ vars.ECS_FRONTEND_SERVICE }}
      COACH_URL: ${{ vars.COACH_SMOKE_URL }}
      SMOKE_BACKEND_API_KEY: ${{ secrets.SMOKE_BACKEND_API_KEY }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install AWS SDK and test the harness without provider calls
        run: |
          python -m pip install 'boto3>=1.34,<2' 'pytest>=8,<9' 'PyYAML>=6,<7'
          python -m pytest -q infra/scripts/tests/test_investment_live_acceptance.py
      - name: Validate live configuration
        run: |
          for name in DEPLOY_ROLE ECS_CLUSTER AI_SERVICE BACKEND_SERVICE FRONTEND_SERVICE COACH_URL SMOKE_BACKEND_API_KEY; do
            [[ -n "${!name}" ]] || { echo "Missing setting: $name"; exit 1; }
          done
          [[ "$GITHUB_RUN_ATTEMPT" == 1 ]] || exit 1
      - name: Use existing short-lived AWS role
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true
      - name: Execute exactly one Investment live evaluation
        run: python infra/scripts/investment_live_acceptance.py
      - name: Retain synthetic questions, answers and live evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: investment-live-evidence
          path: |
            artifacts/investment-live/
            infra/llmsecops/investment-live-*.jsonl
            docs/investment-agent-live-evaluation.md
          if-no-files-found: error
          retention-days: 90
