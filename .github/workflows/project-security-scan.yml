name: Project OWASP Security Scan

on:
  pull_request:
    paths:
      - "apps/**"
      - "knowledge/**"
      - "security/promptfoo/**"
      - "infra/scripts/summarize_*"
      - "infra/scripts/tests/test_summarize_*"
      - ".github/workflows/project-security-scan.yml"
      - "docs/project-security-scan.md"
  push:
    paths:
      - "apps/**"
      - "knowledge/**"
      - "security/promptfoo/**"
      - "infra/scripts/summarize_*"
      - "infra/scripts/tests/test_summarize_*"
      - ".github/workflows/project-security-scan.yml"
      - "docs/project-security-scan.md"
  workflow_dispatch:
    inputs:
      run_live:
        description: Also run paid GPT-6 Luna checks (main only)
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: project-security-${{ github.ref }}
  cancel-in-progress: false

env:
  PROMPTFOO_DISABLE_TELEMETRY: "1"
  PROMPTFOO_DISABLE_UPDATE: "1"
  PROMPTFOO_DISABLE_REMOTE_GENERATION: "true"

jobs:
  promptfoo:
    name: Promptfoo — all agents and router (offline)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            apps/shared/pyproject.toml
            apps/ai-service/pyproject.toml
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: security/promptfoo/package-lock.json
      - name: Install scan dependencies
        run: |
          python -m pip install -e "apps/shared" -e "apps/ai-service[dev]"
          npm ci --prefix security/promptfoo
      - name: Verify provider, grader and report failure detection
        run: |
          ruff check security/promptfoo/provider.py security/promptfoo/tests/test_provider.py infra/scripts/summarize_promptfoo.py infra/scripts/tests/test_summarize_promptfoo.py
          python -m pytest -v security/promptfoo/tests/test_provider.py
          node --test security/promptfoo/tests/assertions.test.cjs
          python -m unittest discover -s infra/scripts/tests -p 'test_summarize_promptfoo.py' -v
      - name: Run Promptfoo OWASP-mapped regression cases
        env:
          PROMPTFOO_MODEL_MODE: offline
          PROMPTFOO_CONFIG_DIR: ${{ runner.temp }}/promptfoo
        run: |
          mkdir -p artifacts
          export PROMPTFOO_PYTHON="$(command -v python)"
          security/promptfoo/node_modules/.bin/promptfoo eval \
            -c security/promptfoo/promptfooconfig.yaml \
            --no-cache --no-share --no-progress-bar --max-concurrency 1 \
            -o artifacts/promptfoo-offline.json -o artifacts/promptfoo-offline.html \
            > artifacts/promptfoo-offline-cli.log 2>&1
      - name: Show test methods, questions, responses and results
        if: always()
        run: >-
          python infra/scripts/summarize_promptfoo.py artifacts/promptfoo-offline.json
          --output artifacts/promptfoo-offline-summary.md
          --title "Project Promptfoo results — offline fixtures"
      - name: Upload Promptfoo JSON and HTML reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: project-promptfoo-offline
          path: artifacts/promptfoo-offline*
          if-no-files-found: error
          retention-days: 7

  application-boundaries:
    name: Application security boundaries — ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            tests: >-
              tests/test_security.py
              tests/test_other_user_data_guard.py
              tests/test_blocked_response_safety.py
              tests/test_budget_capture.py
              tests/test_goal_capture.py
              tests/test_transaction_staging.py
              tests/test_transaction_capture.py::test_named_edit_previews_then_confirm_applies
              tests/test_transaction_capture.py::test_named_edit_cancel_changes_nothing
              tests/test_transaction_capture.py::test_named_delete_previews_then_confirm_deletes
              tests/test_transaction_capture.py::test_named_delete_cancel_keeps_transaction
              tests/test_transaction_capture.py::test_snapshot_contains_only_requesting_users_transactions
              tests/test_transaction_capture.py::test_client_supplied_snapshot_is_replaced_when_db_snapshot_exists
          - service: frontend
            tests: >-
              tests/test_auth.py
              tests/test_app.py::test_profile_deletion_requires_confirmation
              tests/test_app.py::test_source_filename_and_title_cannot_inject_markdown_or_html
              tests/test_app.py::test_blocked_coach_explanation_hides_poison_and_keeps_safety_reference
              tests/test_trace_viewer.py::test_blocked_trace_never_renders_withheld_explanations
              tests/test_trace_viewer.py::test_reference_lookup_missing_profile_switch_and_empty_state
              tests/test_budget_editor.py::test_summary_updates_and_any_plan_amount_change_needs_fresh_confirmation
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            apps/shared/pyproject.toml
            apps/${{ matrix.service }}/pyproject.toml
      - name: Install service in isolated job
        run: python -m pip install -e "apps/shared" -e "apps/${{ matrix.service }}[dev]"
      - name: Test access, confirmation and output boundaries
        working-directory: apps/${{ matrix.service }}
        run: >-
          python -m pytest -vv ${{ matrix.tests }}
          --junitxml=../../artifacts/security-${{ matrix.service }}.xml
      - name: Publish application contract results
        if: always()
        run: >-
          python infra/scripts/summarize_investment_tests.py
          artifacts/security-${{ matrix.service }}.xml
          --output artifacts/security-${{ matrix.service }}-summary.md
          --title "${{ matrix.service }} security contracts (methods; no model responses)"
      - name: Upload application boundary results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: project-security-${{ matrix.service }}
          path: artifacts/security-${{ matrix.service }}*
          if-no-files-found: error
          retention-days: 7

  dispatch-guard:
    name: Validate live scan request
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Reject live scans outside main
        if: github.event_name == 'workflow_dispatch' && inputs.run_live == true && github.ref != 'refs/heads/main'
        run: |
          echo "Live scans require refs/heads/main. Offline scans run on feature branches."
          exit 1

  live:
    name: Promptfoo — all agents and router (live GPT-6 Luna)
    needs: [promptfoo, application-boundaries, dispatch-guard]
    if: github.event_name == 'workflow_dispatch' && inputs.run_live == true && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: live-investment-model-evaluation
      cancel-in-progress: false
    env:
      PROMPTFOO_MODEL_MODE: live
      RUN_LIVE_INVESTMENT_TESTS: "1"
      INVESTMENT_TEST_OPENAI_SECRET_ID: ${{ vars.INVESTMENT_TEST_OPENAI_SECRET_ID }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: security/promptfoo/package-lock.json
      - name: Validate live credentials configuration
        env:
          AWS_ROLE_ARN: ${{ vars.AWS_INVESTMENT_TEST_ROLE_ARN }}
        run: |
          if [[ -z "$AWS_ROLE_ARN" || -z "$INVESTMENT_TEST_OPENAI_SECRET_ID" ]]; then
            echo "Set AWS_INVESTMENT_TEST_ROLE_ARN and INVESTMENT_TEST_OPENAI_SECRET_ID repository variables."
            exit 1
          fi
      - name: Install scan dependencies
        run: |
          python -m pip install -e "apps/shared" -e "apps/ai-service[dev]"
          npm ci --prefix security/promptfoo
      - name: Obtain model secret access through AWS OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_INVESTMENT_TEST_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ap-southeast-1' }}
          mask-aws-account-id: true
      - name: Run paid model scan
        env:
          PROMPTFOO_CONFIG_DIR: ${{ runner.temp }}/promptfoo
        run: |
          mkdir -p artifacts
          export PROMPTFOO_PYTHON="$(command -v python)"
          security/promptfoo/node_modules/.bin/promptfoo eval \
            -c security/promptfoo/promptfooconfig.yaml \
            --no-cache --no-share --no-progress-bar --max-concurrency 1 \
            -o artifacts/promptfoo-live.json -o artifacts/promptfoo-live.html \
            > artifacts/promptfoo-live-cli.log 2>&1
      - name: Show live methods, questions, responses and results
        if: always()
        run: >-
          python infra/scripts/summarize_promptfoo.py artifacts/promptfoo-live.json
          --output artifacts/promptfoo-live-summary.md
          --title "Project Promptfoo results — live GPT-6 Luna"
      - name: Upload live scan evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: project-promptfoo-live
          path: artifacts/promptfoo-live*
          if-no-files-found: error
          retention-days: 7
