name: AWS Operational Validation

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * 0"

concurrency:
  group: operational-validation-demo
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'ap-southeast-1' }}
  DEPLOY_ROLE: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
  ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
  AI_SERVICE: ${{ vars.ECS_AI_SERVICE }}
  BACKEND_SERVICE: ${{ vars.ECS_BACKEND_SERVICE }}
  FRONTEND_SERVICE: ${{ vars.ECS_FRONTEND_SERVICE }}
  BACKEND_CONTAINER_NAME: ${{ vars.ECS_BACKEND_CONTAINER_NAME }}
  FRONTEND_URL: ${{ vars.FRONTEND_URL }}
  ALB_ORIGIN_URL: ${{ vars.ALB_ORIGIN_URL }}
  EDGE_ORIGIN_RESTRICTION_ENABLED: ${{ vars.EDGE_ORIGIN_RESTRICTION_ENABLED || 'false' }}
  EDGE_CUSTOM_DOMAIN_ENABLED: ${{ vars.EDGE_CUSTOM_DOMAIN_ENABLED || 'false' }}
  DASHBOARD_NAME: ${{ vars.OPERATIONAL_DASHBOARD_NAME || 'ai-financial-wellness-coach-demo-operational' }}
  ALARM_PREFIX: ${{ vars.OPERATIONAL_ALARM_PREFIX || 'ai-financial-wellness-coach-demo-' }}

jobs:
  retention:
    name: Enforce governed data retention
    if: >-
      github.event_name == 'workflow_dispatch' ||
      vars.AWS_OPERATIONAL_VALIDATION_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: demo
    steps:
      - name: Validate retention environment
        run: |
          for name in DEPLOY_ROLE ECS_CLUSTER BACKEND_SERVICE BACKEND_CONTAINER_NAME; do
            if [[ -z "${!name}" ]]; then
              echo "Missing demo environment variable: $name" >&2
              exit 1
            fi
          done

      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true

      - name: Enforce governed data retention in a one-shot backend task
        run: |
          mkdir -p artifacts
          network_configuration=$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" --services "$BACKEND_SERVICE" \
            --query 'services[0].networkConfiguration' --output json)
          task_definition=$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" --services "$BACKEND_SERVICE" \
            --query 'services[0].taskDefinition' --output text)
          overrides=$(jq -nc --arg name "$BACKEND_CONTAINER_NAME" \
            '{containerOverrides:[{name:$name,command:["python","-m","app.jobs.purge_data_lifecycle"]}]}')
          aws ecs run-task \
            --cluster "$ECS_CLUSTER" \
            --task-definition "$task_definition" \
            --launch-type FARGATE \
            --network-configuration "$network_configuration" \
            --overrides "$overrides" \
            > artifacts/data-lifecycle-retention-run.json
          jq -e '(.failures | length) == 0 and (.tasks | length) == 1' \
            artifacts/data-lifecycle-retention-run.json > /dev/null
          task_arn=$(jq -r '.tasks[0].taskArn' artifacts/data-lifecycle-retention-run.json)
          aws ecs wait tasks-stopped --cluster "$ECS_CLUSTER" --tasks "$task_arn"
          aws ecs describe-tasks \
            --cluster "$ECS_CLUSTER" --tasks "$task_arn" \
            > artifacts/data-lifecycle-retention-task.json
          exit_code=$(jq -r --arg name "$BACKEND_CONTAINER_NAME" \
            '.tasks[0].containers[] | select(.name == $name) | .exitCode' \
            artifacts/data-lifecycle-retention-task.json)
          if [[ "$exit_code" != "0" ]]; then
            echo "Data-lifecycle retention task failed with exit code $exit_code" >&2
            exit 1
          fi

      - name: Upload privacy-safe retention evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: aws-retention-evidence-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 90

  validate:
    name: Validate AWS operations
    if: >-
      github.event_name == 'workflow_dispatch' ||
      vars.AWS_OPERATIONAL_VALIDATION_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: demo
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Record GitHub Actions notification scope
        run: |
          mkdir -p artifacts
          echo '{"mode":"github_actions_only","email_delivery_validated":false,"cloudwatch_events_forwarded_to_github":false}' \
            > artifacts/notification-scope.json
          {
            echo "## Operational reporting"
            echo
            echo "Failures are reported through this GitHub Actions run and its retained artifacts."
            echo "Email delivery is not validated; CloudWatch alarm events are not forwarded to GitHub."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Validate operational environment
        run: |
          required=(
            DEPLOY_ROLE ECS_CLUSTER AI_SERVICE BACKEND_SERVICE FRONTEND_SERVICE
            DASHBOARD_NAME ALARM_PREFIX
          )
          for name in "${required[@]}"; do
            if [[ -z "${!name}" ]]; then
              echo "Missing demo environment variable: $name" >&2
              exit 1
            fi
          done
          if [[ "$EDGE_ORIGIN_RESTRICTION_ENABLED" == "true" ]] &&
             [[ -z "$FRONTEND_URL" || -z "$ALB_ORIGIN_URL" ]]; then
            echo "Edge hardening validation requires FRONTEND_URL and ALB_ORIGIN_URL" >&2
            exit 1
          fi

      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true

      - name: Capture and verify ECS service state
        run: |
          mkdir -p artifacts
          aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$AI_SERVICE" "$BACKEND_SERVICE" "$FRONTEND_SERVICE" \
            > artifacts/ecs-services.json
          jq -e '
            (.failures | length) == 0 and
            ([.services[] | select(.status != "ACTIVE" or .runningCount < .desiredCount)] | length) == 0
          ' artifacts/ecs-services.json > /dev/null
          aws application-autoscaling describe-scalable-targets \
            --service-namespace ecs \
            > artifacts/ecs-scalable-targets.json
          jq -e --arg cluster "$ECS_CLUSTER" --arg ai "$AI_SERVICE" --arg backend "$BACKEND_SERVICE" '
            [.ScalableTargets[] |
              select(.ResourceId == "service/\($cluster)/\($ai)" or
                     .ResourceId == "service/\($cluster)/\($backend)")] |
            length == 2 and all(.[]; .MinCapacity == 1 and .MaxCapacity == 2)
          ' artifacts/ecs-scalable-targets.json > /dev/null

      - name: Verify CloudWatch dashboard and alarms
        env:
          EXPECTED_ALARM_SUFFIXES: >-
            ["coach-quota-denials", "backend-5xx", "backend-unhealthy-host",
             "ai-generation-failure", "ai-high-cpu"]
        run: |
          aws cloudwatch get-dashboard \
            --dashboard-name "$DASHBOARD_NAME" \
            > artifacts/cloudwatch-dashboard.json
          aws cloudwatch describe-alarms \
            --alarm-name-prefix "$ALARM_PREFIX" \
            > artifacts/cloudwatch-alarms.json
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          expected = {
              os.environ["ALARM_PREFIX"] + suffix
              for suffix in json.loads(os.environ["EXPECTED_ALARM_SUFFIXES"])
          }
          evidence = json.loads(Path("artifacts/cloudwatch-alarms.json").read_text())
          actual = {alarm["AlarmName"] for alarm in evidence["MetricAlarms"]}
          missing = sorted(expected - actual)
          if missing:
              raise SystemExit("Missing required operational alarms: " + ", ".join(missing))
          PY

      - name: Verify CloudFront TLS and direct-origin denial
        if: env.EDGE_ORIGIN_RESTRICTION_ENABLED == 'true'
        run: |
          custom_domain_args=()
          if [[ "$EDGE_CUSTOM_DOMAIN_ENABLED" == "true" ]]; then
            custom_domain_args=(--expected-custom-domain "${FRONTEND_URL#https://}")
          fi
          python infra/scripts/edge_security_validation.py \
            --frontend-url "$FRONTEND_URL" \
            --origin-url "$ALB_ORIGIN_URL" \
            --output artifacts/edge-security.json \
            "${custom_domain_args[@]}"

      - name: Upload privacy-safe operational evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: aws-operational-evidence-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 90
