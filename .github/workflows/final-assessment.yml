name: Final Assessment

on:
  workflow_dispatch:
    inputs:
      repeats:
        description: Repetitions of each live evaluation case
        required: true
        default: "3"
        type: string
      load_requests:
        description: Number of bounded synthetic load requests
        required: true
        default: "10"
        type: string
      load_concurrency:
        description: Maximum concurrent synthetic requests
        required: true
        default: "2"
        type: string
      exercise_task_replacement:
        description: Force and verify one backend ECS task replacement
        required: true
        default: false
        type: boolean

concurrency:
  group: final-assessment-demo
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  repository-evidence:
    name: Validate assessment scope and repository evidence
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require the assessed main branch
        env:
          ASSESSMENT_REF: ${{ github.ref }}
        run: |
          if [[ "$ASSESSMENT_REF" != "refs/heads/main" ]]; then
            echo "Final assessment must run from main, not $ASSESSMENT_REF" >&2
            exit 1
          fi

      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Verify the assessed commit passed push CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p artifacts
          gh api \
            "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&event=push&status=completed&per_page=10" \
            > artifacts/ci-runs.json
          jq -e \
            '[.workflow_runs[] | select(.conclusion == "success")][0]' \
            artifacts/ci-runs.json \
            > artifacts/ci-evidence.json
          jq '{workflow: .name, run_id: .id, run_url: .html_url, head_sha: .head_sha, conclusion}' \
            artifacts/ci-evidence.json \
            > artifacts/ci-evidence-normalized.json
          mv artifacts/ci-evidence-normalized.json artifacts/ci-evidence.json
          rm artifacts/ci-runs.json

      - name: Validate and inventory assessment evidence
        run: >-
          python infra/scripts/final_assessment.py
          --manifest infra/llmsecops/final-assessment-manifest.json
          --output artifacts/final-assessment.json
          --markdown-output artifacts/final-assessment-summary.md

      - name: Publish assessment summary
        run: cat artifacts/final-assessment-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload privacy-safe assessment evidence
        uses: actions/upload-artifact@v7
        with:
          name: final-assessment-evidence-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 90

  operational-evidence:
    name: Run live AWS assessment gates
    needs: repository-evidence
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/aws-operational-validation.yml
    with:
      repeats: ${{ inputs.repeats }}
      load_requests: ${{ inputs.load_requests }}
      load_concurrency: ${{ inputs.load_concurrency }}
      exercise_task_replacement: ${{ inputs.exercise_task_replacement }}
    secrets: inherit
