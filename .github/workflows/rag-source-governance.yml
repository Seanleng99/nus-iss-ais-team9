name: RAG Source Governance

on:
  workflow_dispatch:
  schedule:
    - cron: "30 2 * * 0"

permissions:
  contents: read

jobs:
  audit:
    name: Validate packaged Education and Policy corpora
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/ai-service/pyproject.toml
      - name: Install corpus validation runtime
        run: python -m pip install -e "apps/shared" -e "apps/ai-service[dev]"
      - name: Verify manifests, provenance, approval, freshness, and document checksums
        run: python infra/scripts/validate_packaged_corpora.py
      - name: Upload governance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: packaged-rag-governance-${{ github.run_id }}
          path: artifacts/packaged-corpus-governance.json
          if-no-files-found: warn
          retention-days: 90
