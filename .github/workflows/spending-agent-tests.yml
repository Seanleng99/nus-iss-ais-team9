name: Spending Agent Tests

# CI owns automatic execution; dispatch retains focused troubleshooting runs.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spending-agent-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  offline:
    name: Offline spending analysis contracts
    uses: ./.github/workflows/agent-test-suite.yml
    with:
      suite: spending-offline
      label: "Offline spending analysis contracts"

  functional:
    name: Functional tests — ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: capture
            label: "Capture and clarification"
          - group: coverage
            label: "Dated records and history"
          - group: integration
            label: "Analysis and independent review"
    uses: ./.github/workflows/agent-test-suite.yml
    with:
      suite: spending-functional-${{ matrix.group }}
      label: "Spending Agent Tests — ${{ matrix.label }}"
